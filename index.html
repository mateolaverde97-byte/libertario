:root{
  --bg:#07080B;--bg2:#0C0D12;--tx:#F1E8DF;--mut:rgba(241,232,223,.58);--dim:rgba(241,232,223,.36);
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);
  --glass:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  --teal:#09A7A2;--org:#F89A3C;--red:#F74544;--lime:#B8EC03;--pur:#B500F8;--cya:#02CFF2;--navy:#021233;--blue:#6F7BFF;
  --pos:#9BE15D;--neg:#FF6B5E;--r:22px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(900px 520px at 8% -8%,rgba(98,104,170,.42),transparent 60%),
   radial-gradient(700px 420px at 100% 0%,rgba(9,167,162,.10),transparent 65%),
   radial-gradient(1.2px 1.2px at 12% 22%,rgba(255,255,255,.35),transparent 60%),
   radial-gradient(1px 1px at 32% 8%,rgba(255,255,255,.28),transparent 60%),
   radial-gradient(1px 1px at 58% 14%,rgba(255,255,255,.22),transparent 60%),
   radial-gradient(1.4px 1.4px at 82% 30%,rgba(255,255,255,.2),transparent 60%),
   radial-gradient(1px 1px at 22% 48%,rgba(255,255,255,.18),transparent 60%),
   radial-gradient(1px 1px at 70% 62%,rgba(255,255,255,.14),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.app{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(18,19,28,.82),rgba(9,10,14,.92));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;padding:26px 22px 0;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:600;letter-spacing:.005em}
.brand small{display:block;color:var(--mut);font-size:12.5px}
.hello{padding:22px 0 18px;border-bottom:1px solid var(--line)}
.hello h2{font-size:30px;line-height:1.02;font-weight:600;letter-spacing:-.01em}
.hello p{color:var(--mut);font-size:13px;margin-top:10px}
.nav{padding:14px 0 18px;flex:1}
.nav .grp{color:var(--mut);font-size:13px;margin:16px 0 8px}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:2px -4px;border-radius:14px;color:var(--mut);text-decoration:none;font-size:16px;border:1px solid transparent;position:relative}
.nav a svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav a:hover{color:var(--tx)}
.nav a.on{color:var(--tx);background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav a.on::after{content:"";position:absolute;right:14px;top:50%;width:2px;height:16px;margin-top:-8px;background:var(--tx);border-radius:2px}
.nav a.on .badge{margin-right:14px}
.nav .badge{margin-left:auto;font-size:11.5px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--line2)}
.stripe{display:flex;height:8px;margin:0 -22px}
.stripe i{flex:1}
/* ---------- main ---------- */
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(18px + var(--sat)) 34px 18px;background:rgba(7,8,11,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--mut);min-width:0}
.crumb svg{width:26px;height:26px;stroke:var(--mut);fill:none;stroke-width:1.4;flex:none}
.crumb b{color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(155,225,93,.15)}
.chip.off .dot{background:var(--org);box-shadow:0 0 0 3px rgba(248,154,60,.15)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;border:1px solid var(--line2);background:var(--glass);font-weight:500;font-size:14.5px;white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.btn.pri{background:var(--tx);color:#0B0B0E;border-color:transparent;font-weight:600}
.btn.teal{background:var(--teal);color:#04110F;border-color:transparent;font-weight:600}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--glass)}
.iconbtn svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:1.6}
/* ticker */
.ticker{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .run{display:inline-flex;animation:tick 48s linear infinite;padding:15px 0}
.ticker:hover .run{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:12px;padding:0 26px;border-right:1px solid var(--line2);font-size:15px}
.tk .k{color:var(--mut)}
.tk .v{font-weight:500}
.tk i{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#0B0B0E}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none}}
#view{padding:34px 34px 120px;max-width:1280px;width:100%}
/* ---------- type ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14.5px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.eyebrow svg.i,.blockh svg.i{width:19px;height:19px;color:var(--mut)}
.h1 .star{color:var(--org)}
.eyebrow .pulse{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
.eyebrow .pulse::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--tx)}
.eyebrow.live .pulse::after{background:var(--pos);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.h1{font-size:clamp(38px,5.2vw,58px);line-height:.98;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px;background:linear-gradient(90deg,var(--tx) 0%,var(--tx) 55%,rgba(241,232,223,.42) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.h1 .star{display:inline-block;width:.7em;height:.7em;vertical-align:.02em;margin-left:.15em}
.h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14.5px}
.sec{margin-top:40px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sechead .eyebrow svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.5}
.cond{font-stretch:68%;text-transform:uppercase;font-weight:800;letter-spacing:.02em}
.big{font-size:44px;line-height:1;font-weight:500;letter-spacing:-.02em;background:linear-gradient(90deg,var(--tx) 50%,rgba(241,232,223,.45));-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{color:var(--neg)}.pos{color:var(--pos)}
/* ---------- cards ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;border:1px solid var(--line2);border-radius:var(--r);background:var(--glass);padding:22px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card.tap{cursor:pointer;transition:border-color .2s,transform .2s}

.card .glow{position:absolute;left:0;bottom:0;width:60%;height:70%;pointer-events:none;opacity:.55;filter:blur(40px)}
.card .edge{position:absolute;left:0;top:132px;width:3px;height:34px;border-radius:0 3px 3px 0}
.ch{display:flex;align-items:center;gap:14px}
.coin{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line2);background:rgba(255,255,255,.03);flex:none}
.coin span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#0B0B0E}

.lab{color:var(--mut);font-size:14px;margin-top:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill.pos{background:rgba(155,225,93,.12);color:var(--pos);border-color:rgba(155,225,93,.18)}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spark{display:block;width:100%;height:110px;margin-top:8px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--mut)}
/* table */
.tbl{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.012)}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{font-weight:400;color:var(--mut);font-size:13.5px;text-align:left;padding:16px 18px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tap{cursor:pointer}
.tbl tr.tap:hover td{background:rgba(255,255,255,.025)}
.tbl .r{text-align:right}
.tbl .n{color:var(--dim)}
.scrollx{overflow-x:auto}
/* list */
.list{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.012)}
.li{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}

.li .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);flex:none;background:rgba(255,255,255,.03)}

.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.02);overflow-x:auto;max-width:100%;scrollbar-width:none}

.tl{position:relative}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;bottom:0;width:min(760px,100%);max-height:92vh;transform:translate(-50%,104%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;background:linear-gradient(180deg,#14151C,#0C0D12);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:0 -30px 80px rgba(0,0,0,.5)}

.blockh{font-size:13px;color:var(--mut);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.blockh:first-child{margin-top:0}
.prose{font-size:15px;line-height:1.55;white-space:pre-line;color:rgba(241,232,223,.9)}
/* forms */
.f{display:grid;gap:16px}
.fl label,.fl .lb{display:block;color:var(--mut);font-size:13px;margin-bottom:7px}
.in{width:100%;height:50px;padding:0 15px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.035);outline:none;font-size:16px}
.in:focus{border-color:rgba(111,123,255,.55);box-shadow:0 0 0 3px rgba(111,123,255,.15)}
textarea.in{height:auto;min-height:84px;padding:12px 15px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.in option,select.in optgroup{background:#14151C;color:var(--tx)}
.money{font-size:30px;height:66px;font-weight:500;letter-spacing:-.01em}

.chips button .d{width:9px;height:9px;border-radius:50%}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px}
.err{color:var(--neg);font-size:13px}
.note{border:1px solid rgba(248,154,60,.3);background:rgba(248,154,60,.07);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#FFD2A6}
.note.tl{border-color:rgba(9,167,162,.3);background:rgba(9,167,162,.07);color:#9FE7E3}

.qn{font-size:17px;font-weight:500;line-height:1.2}

.owner b{color:var(--tx);font-weight:500}.owner .d{width:9px;height:9px;border-radius:50%}
.qp{text-align:right;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.qp b{font-size:20px;color:var(--tx);font-weight:500}
.qc{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;align-items:end}
.qc .full{grid-column:1/-1}
.qc .in{height:44px;font-size:15px}
.chk{height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chk.on{background:var(--pos);color:#0B0B0E;border-color:transparent}
.rrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rchip{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.04);font-size:13px;overflow:hidden}
.rchip button{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;max-width:220px}
.rchip button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip .rx{padding:7px 8px;border-left:1px solid var(--line2);color:var(--mut)}
.rup{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px dashed rgba(241,232,223,.35);font-size:13px;color:var(--mut);cursor:pointer;position:relative}
.rup input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rup.dis{opacity:.6;pointer-events:none}
button.pill{cursor:pointer}
@media (max-width:980px){.qgrid{grid-template-columns:1fr}.qc{grid-template-columns:1fr 1fr}.qc .chk{grid-column:1/-1}}
/* asistente */
.mic{height:58px;border-radius:16px;border:1px solid var(--line2);background:rgba(9,167,162,.12);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;color:#9FE7E3;position:relative;cursor:pointer}

.mic.alt{background:rgba(255,255,255,.04);color:var(--tx)}
.mic input{position:absolute;inset:0;opacity:0;cursor:pointer}

 "Palabra"], ["11:45 – 12:00", "Desmontaje y salida"]], "info": [], "ppto": 250000, "place": "Las Palmas", "desc": "Las Palmas, una de las zonas más golpeadas por el terremoto: acompañamiento y oración por familias y personas. Si el lugar lo permite, niños y adultos van por separado; se define en el sitio y el equipo lleva material para ambos. El equipo 3 hace la logística.", "logi": ["3"], "serv": []}, {"id": "b7", "n": 7, "day": "vie", "title": "Recreación en Reposo Dos", "hora": "2:00 – 4:45 pm", "horario": [["2:00 – 2:15", "Organización y montaje"], ["2:15 – 3:45", "Juegos y actividades de los equipos"], ["3:45 – 4:00", "Refrigerio y organización del taller de salud mental"], ["4:00 – 4:45", "Taller de salud mental (ver Bloque 8)"], ["4:45", "Desmontaje, recogida y salida"]], "info": [], "ppto": 200000, "place": "Reposo Dos", "desc": "Recreación con juegos simultáneos para los que van llegando; el equipo invita y \"hace bulla\" para atraer gente. Niños (ruta de exploradores, equipos 1 y 2) y conexión con adultos (olimpiadas de alegría, equipos 5 y 3). El equipo 4 apoya el montaje.", "logi": ["4"], "serv": []}, {"id": "b8", "n": 8, "day": "vie", "title": "Taller de salud mental", "hora": "4:00 – 4:45 pm", "horario": [["3:45 – 4:00", "Refrigerio y organización del taller (los grupos del Bloque 7 ayudan a organizar a la gente)"], ["4:00 – 4:45", "Taller por grupos: un solo grupo de adultos y un solo grupo de niños"], ["4:45", "Desmontaje, recogida y salida"]], "info": ["No hay palabra conjunta ni presentaciones."], "ppto": null, "place": "Reposo Dos", "desc": "Los mismos grupos de la recreación ayudan a organizar a la gente. Un solo grupo de adultos (cuerda de tres hilos, equipos 4 y 1) y un solo grupo de niños (\"Dios cuida mi corazón y mis emociones\", equipos 3 y 5). No hay palabra conjunta ni presentaciones. El equipo 2 hace la logística.", "logi": ["2"], "serv": []}, {"id": "b9", "n": 9, "day": "sab", "title": "Las Terrazas", "hora": "8:30 am – 12:00 m", "horario": [["8:30 – 8:45", "Llegada y montaje"], ["8:45 – 11:45", "Actividades"], ["11:45 – 12:00", "Recogida y salida"]], "info": ["El equipo 4 participa completo en conexión con el equipo 2. El equipo 5 apoya al equipo 1 en la actividad de niños."], "ppto": 200000, "place": "Las Terrazas", "desc": "Compartir con la comunidad: acompañamiento, oración y actividades con adultos y niños. Pueden sumarse voluntarios de Quibdó. Conexión con adultos (jornada comunitaria, equipos 2 y 4 completo) y niños (búsqueda del tesoro, que ejecuta el equipo 1 con el apoyo del equipo 5). Pausa de refrigerio a las 10:30 (la entrega Nata con algunos miembros de los equipos) para dar un descanso a las actividades.", "logi": [], "serv": []}, {"id": "ap", "n": null, "day": "sab", "title": "Aposento Alto", "hora": "8:30 – 10:30 am", "horario": [["8:30 – 8:40", "Llegada"], ["8:40 – 9:00", "Obra de teatro"], ["9:00 – 9:15", "Testimonio corto"], ["9:15 – 10:00", "Palabra a los pastores"], ["10:00 – 10:15", "Oración por los pastores y líderes"], ["10:15 – 10:30", "Entrega de refrigerio"]], "info": ["Cambio de rol: el equipo 3 va al Aposento Alto como apoyo logístico junto con el teatro (no necesita propuesta).", "Su propuesta de niños para Las Terrazas (búsqueda del tesoro) la ejecuta el equipo 1, con apoyo del equipo 5. Puede ser necesaria la ayuda del equipo 3 para el equipo que ejecuta su programa."], "ppto": 0, "place": "Aposento Alto", "desc": "Reunión convocada por Carlos con líderes, pastores y hermanos de iglesias para dar seguimiento a su proceso de grupos de oración e intercesión por la ciudad y la unidad de la iglesia. Solo va el equipo 3, como apoyo logístico, con el teatro.", "logi": ["3"], "serv": []}, {"id": "b10", "n": 10, "day": "sab", "title": "Malecón", "hora": "4:00 – 6:30 pm", "horario": [["4:00 – 4:30", "Llegada y organización en el Malecón"], ["4:30 – 5:00", "Juegos, invitación de personas, conversaciones"], ["5:00 – 5:10", "Danza"], ["5:10 – 5:30", "Teatro"], ["5:30 – 6:00", "Palabra"], ["6:00 – 6:20", "Conversaciones y cierres"], ["6:20 – 6:30", "Desmontaje y salida a la base"]], "info": [], "ppto": 250000, "place": "Parque El Malecón", "desc": "Parque El Malecón. Tiene árboles pero no casetas. Si llueve, se resguardan bajo casas o edificios cercanos; si el aguacero es muy fuerte y hay tiempo, vuelven a la casa, a 5 cuadras. Niños (juegos rápidos, equipos 2 y 5) y conexión con adultos (juego de puntería del equipo 3 y conversaciones del equipo 4). Teatro del equipo artístico para atraer gente. El equipo 1 hace la logística. Durante toda la actividad se reparten bolsas de agua (~300) como medio de conexión, sin un momento concreto.", "logi": ["1"], "serv": []}], "FICHAS": [{"id": "b2-con", "b": "b2", "rol": "conexion", "tit": "La silla del mal día", "eq": [2, 5], "line": "Un espacio para escuchar a quien tuvo un mal día, compartir un versículo y orar.", "ven": [["17:00", "18:00"]], "notas": ["Actividades de 5:00 a 6:00 pm.", "Incluir las tarjetas de emociones de la propuesta de evangelismo de Camila (vienen precargadas en materiales)."], "estado": "enviada", "act": "17/11/2026 18:43:30", "editor": "Camila Berruecos", "que": "Preparar un espacio acogedor en el que las personas encuentren dos sillas, una mesa pequeña y un letrero que diga:\n¿HAS TENIDO UN MAL DÍA? SIÉNTATE ❤️", "enfoque": "Enfoque: Jesús es nuestra fuente de descanso, esperanza y consuelo en medio de las dificultades de la vida. No tenemos que cargar solos nuestras preocupaciones, porque Él nos invita a acercarnos y encontrar descanso en su presencia.\n\nFundamento bíblico: Mateo 11:28 (NTV)\n«Luego dijo Jesús: “Vengan a mí todos los que están cansados y llevan cargas pesadas, y yo les daré descanso”».\n\nMensaje central: Así como queremos ofrecer un espacio para escuchar y acompañar a las personas, queremos recordarles que Jesús también desea escucharlas, recibirlas y darles descanso. En Él podemos encontrar perdón, amor, esperanza y una nueva oportunidad.\nPrincipio bíblico: Acercarnos a Jesús y depositar nuestras cargas en Él, reconociendo que su amor y su gracia nos sostienen aun en los momentos difíciles", "como": "Se preparará un espacio acogedor con dos sillas, una mesa pequeña y un letrero visible que diga: «¿HAS TENIDO UN MAL DÍA? SIÉNTATE ❤️» y otro que diga \"QUE LE PREGUNTARÍAS A  DIOS\".\nEl equipo estará cerca del espacio y abordará a las personas con una sonrisa, de manera amable y espontánea, sin perseguirlas ni presionarlas. Se les invitará a tomar asiento y disfrutar de un momento de conversación, escucha y acompañamiento.\nFrases para atraer:\n«¡Hola! ¿Cómo estás? Hoy tenemos un espacio para escucharte. ¿Te gustaría sentarte un momento?».\n«¿Qué tal ha estado tu día? Tenemos una silla disponible para ti».\n«No necesitas comprar nada ni tener una razón especial. Queremos regalarte unos minutos para escucharte».\n\n1. ATRAEMOS ❤️\n\nInvitamos a los adultos con amabilidad a acercarse y tomar asiento. Les ofrecemos un espacio tranquilo para compartir, conversar y disfrutar de un momento diferente en medio de sus actividades cotidianas.\n\n2. CONVERSAMOS 💬\nIniciamos una conversación cercana mediante preguntas sencillas:\n\n¿Cómo te has sentido estos días?\n¿Cómo ha estado tu día?\n¿Hay algo que te esté preocupando últimamente?\nEscuchamos con atención, empatía y respeto, permitiendo que cada persona se exprese libremente, sin juzgar ni interrumpir.\n\n3. COMPARTIMOS 📖\n\nA partir de lo que la persona nos comparte, conectamos su experiencia con el mensaje de Jesús. Le hablamos de su amor, de su perdón y de la esperanza que encontramos en Él. Compartimos Mateo 11:28, recordando que Jesús invita a acercarse a Él cuando estamos cansados y cargados.\n\n4. ORAMOS 🙏\n\nPreguntamos si tiene alguna petición o situación por la que le gustaría recibir oración. Si acepta, realizamos una oración por su vida, familia y necesidades, recordándole que puede acercarse a Dios y depositar sus cargas en Él.", "mm": [{"a": "17:00", "b": "17:05", "q": "Oracion inicial: Los 10 miembro del equipo   se reúnen para orar juntos. Entregan la actividad a Dios, piden que Él prepare los corazones de las personas, guíe cada conversación y les permita transmitir su amor.", "p": "Camila Berruecos"}, {"a": "17:05", "b": "17:10", "q": "Preparación del espacio\tOrganizan las sillas, la mesa, el cartel de invitación, las Biblias y las tarjetas con versículos. Distribuyen las funciones de cada voluntario.", "p": "David Castaño"}, {"a": "17:10", "b": "17:20", "q": "Invitación\tDos miembros del equipo invitan amablemente a los adultos a acercarse y sentarse. ", "p": "María Alejandra Aguilar"}, {"a": "17:20", "b": "17:35", "q": "Escucha y conversación\tSe escucha a cada persona con atención, empatía y respeto. Se le permite expresar cómo se siente o qué situaciones está atravesando.", "p": "Lizeth Varón"}, {"a": "17:35", "b": "17:45", "q": "Compartir la Palabra\tSe presenta el mensaje de Jesús como fuente de amor, esperanza y descanso, utilizando Mateo 11:28.", "p": "Sarah Forero"}, {"a": "17:45", "b": "17:55", "q": "Oración por las personas\tSe pregunta si desean compartir una petición de oración. Con su autorización, se ora por sus necesidades, familia y situaciones personales.", "p": "Gabriela Arteaga"}, {"a": "17:55", "b": "18:00", "q": "Cierre y despedida\tSe agradece su participación, se entrega una tarjeta con un versículo bíblico y se despide a cada persona con cariño.", "p": "Juan José Lugo"}], "pe": [{"p": "María Alejandra Aguilar", "r": "Invitan a los adultos a acercarse y tomar asiento."}, {"p": "Silvana Caballero", "r": "Invitan a los adultos a acercarse y tomar asiento."}, {"p": "Lizeth Varón", "r": "Escuchan, generan confianza y conocen las necesidades de las personas."}, {"p": "Lizeth Pérez", "r": "Escuchan, generan confianza y conocen las necesidades de las personas. + la realizacion  de tarjetas de emociones"}, {"p": "Sarah Forero", "r": "Comparten el evangelio y una palabra de esperanza."}, {"p": "Yeison Hernández", "r": "Comparten el evangelio y una palabra de esperanza."}, {"p": "Gabriela Arteaga", "r": "Acompañan las peticiones y realizan la oración+ realización tarjetas de emociones"}, {"p": "Juan José Lugo", "r": "Acompañan las peticiones y realizan la oración."}, {"p": "Camila Berruecos", "r": "Oracion inicial "}, {"p": "David Castaño", "r": "Preparacion del espacio"}], "jg": [], "ma": [{"i": "IMPRESIONES A COLOR /TARJETA DE EMOCIONES CON VERSICULOS", "t": "5.5 CM ANCHO * 3 CM LARGO (24 TARJETAS *HOJA*", "c": 4, "s": "Bogotá", "re": false}, {"i": "Cartulina ", "t": "Pliego ", "c": 2, "s": "Bogotá", "re": false}, {"i": "Marcador grueso negro ", "t": "Grueso ", "c": 2, "s": "Bogotá", "re": false}, {"i": "IMPRESIONES A COLOR/INVITACION AL EVENTO", "t": "9 CM ANCHO * 8 CM DE LARGO", "c": 5, "s": "Bogotá", "re": false}, {"i": "Biblias ", "t": "x", "c": 2, "s": "Ya lo tenemos", "re": true}], "lluvia": "¿Dónde se hace?\nBuscar refugio en una edificación cercana que permita reunir a los participantes.\nEvitar permanecer en espacios abiertos o debajo de árboles.\n¿Qué se ajusta?\n- Mantendremos la dinámica principal: invitar a las personas a sentarse y compartir cómo ha sido su día.\n- Adaptaremos la actividad para realizarla en un espacio más reducido.\n¿Cómo se protegen los materiales?\nGuardar las tarjetas, hojas, carteles y marcadores en bolsas plásticas.\nProteger la silla y el elemento decorativo con plástico si deben trasladarse bajo la lluvia.", "nec": "Transporte de sillas "}, {"id": "b2-nin", "b": "b2", "rol": "ninos", "tit": "Juntos somos un solo cuerpo", "eq": [4, 3], "line": "Cinco desafíos por equipos sobre 1 Corintios 12.", "ven": [["17:00", "18:00"]], "notas": ["Actividades de 5:00 a 6:00 pm."], "estado": "enviada", "act": "17/11/2026 15:45:58", "editor": "Daniel Moreno", "que": "A través de cinco desafíos por equipos, los niños descubrirán que cuando cada persona aporta sus habilidades, ayuda a los demás y trabaja en unidad, pueden lograr grandes cosas. ", "enfoque": "1 Corintios 12:12-27.\nAsí como el cuerpo tiene muchas partes y cada una cumple una función importante, en un equipo todos somos diferentes, pero necesarios. Dios nos llama a trabajar unidos, ayudarnos y reconocer que nadie debe quedarse atrás.\n\nJuntos somos un solo cuerpo", "como": "Actividad principal:  Hacer entre 3-5 equipos (dependiendo la cantidad de niños) deberán completar 6 desafios de trabajo en equipo como: \n\n1. Hacer una cadena humana y pasar el aro de un lado al otro sin usar las manos, \n2. Puente humano, debe pasar niño por niño hacer un puente humano con su cuerpo.\n3. en círculos por equipos no dejar caer la bomba. \n4.  Hacer filas y tener que pasar un globo por debajo de las piernas y después por encima de la cabeza de todos los participantes.\n5. Completar una frase por equipos", "mm": [{"a": "17:00", "b": "17:05", "q": "● Llegada, montaje y oración inicial\n● Recibir a los niños con música alegre. \n● Invitarlos a ubicarse en un espacio amplio donde todos puedan verse y escucharse. \n● Darles la bienvenida y explicarles que tendrán una serie de retos en los que necesitarán trabajar juntos. \n● Contarles que al final descubrirán qué tienen en común todos los desafíos.\n\n", "p": "Todo el equipo"}, {"a": "17:05", "b": "17:10", "q": "Formación de equipos: dividir en equipos, cada equipo debe crear un  nombre y una barra", "p": "Todo el equipo"}, {"a": "17:10", "b": "17:40", "q": " Actividad principal: cuatro desafíos de trabajo en equipo.\n\nHacer entre 3-5 equipos (dependiendo la cantidad de niños) deberan completar 4 desafios de trabajo en equipo como:\n\n1. Hacer una cadena humana y pasar el aro de un lado al otro sin usar las manos.\n2. Puente humano, debe pasar niño por niño hacer un puente humano con su cuerpo.\n3. en circulos por equipos no dejar caer la bomba. \n4. Hacer filas y tener que pasar un globo por debajo de las piernas y despues por encima de la cabeza de todos los participantes.\n5. Completar una frase por equipos\n", "p": ""}, {"a": "17:40", "b": "17:55", "q": "Reflexión final corta:\n\nHaz preguntas como: 1. ¿Cuál de los desafíos les pareció más difícil? 2. ¿Qué pasó cuando alguien no ayudaba a su equipo? 3. ¿Pudieron completar los retos sin la ayuda de sus compañeros? 4. ¿Todos tenían algo importante que aportar? \n\n«¿Se dieron cuenta de que en ninguno de estos desafíos una sola persona podía hacerlo todo? Necesitábamos a los demás. Así funciona nuestro cuerpo y así funciona también la iglesia. Dios nos hizo diferentes, con habilidades diferentes, pero todos tenemos un lugar importante. No importa si somos pequeños, grandes, rápidos o lentos: todos podemos aportar algo». \n\nLee nuevamente una parte de 1 Corintios 12:21-26 y resalta que ninguna parte del cuerpo puede decirle a otra que no la necesita. ", "p": ""}, {"a": "17:55", "b": "18:00", "q": "Oración final y despedida.", "p": ""}], "pe": [{"p": "Isabella Beltrán", "r": "Coordinación general de los juegos, encargada del grupo 1"}, {"p": "Daniel Moreno", "r": "Apoyo a isabella en las actividades, encargado de grupo 2"}, {"p": "Samuel Carrillo", "r": "Apoyo a isabella en las actividades, encargado de grupo 3"}, {"p": "Alejandra Hernández", "r": "Apoyo a isabella en las actividades, encargado de grupo 4"}, {"p": "Natalia Casallas", "r": "Apoyo a isabella en las actividades, encargado de grupo 5"}, {"p": "Anngie Moreno", "r": "Apoyo a isabella en las actividades, apoyo de grupo 1"}, {"p": "Allisson Domínguez", "r": "Apoyo a isabella en las actividades, apoyo de grupo 2"}, {"p": "Emanuel Rodríguez", "r": "Apoyo a isabella en las actividades, apoyo de grupo 3"}, {"p": "Samuel Isaacs", "r": "Apoyo a isabella en las actividades, apoyo de grupo 4"}, {"p": "Nataly Ruiz", "r": "Apoyo a isabella en las actividades, apoyo de grupo 5"}], "jg": [], "ma": [{"i": "Aros ula ula", "t": "Tamaño estandar entre 50 - 60 cm", "c": 5, "s": "Bogotá", "re": false}, {"i": "Paquete de bombas", "t": "1 paquete de 12", "c": 1, "s": "Bogotá", "re": false}, {"i": "Hojas blancas ", "t": "Tamaño carta ", "c": 50, "s": "Bogotá", "re": false}], "lluvia": "Se reduce a solamente 3 actividades que se pueden hacer en espacio reducido.", "nec": "Verificar si en la iglesia hay aros que se puedan usar. \n"}, {"id": "b3-p1", "b": "b3", "rol": "ninos", "tit": "Parte 1 · Juegos de trabajo en equipo", "eq": [2, 5], "line": "Juegos donde se depende del otro, con Eclesiastés 4:9-10, para todos los niños.", "ven": [["8:10", "9:50"]], "notas": ["Parte 1 para todos los niños: ajustar la actividad a 8:10 – 9:50 am."], "estado": "enviada", "act": "16/11/2026 22:53:05", "editor": "David Castaño", "que": "Juegos de trabajo en equipo acorde al principio bíblico y enseñanza del compañerismo", "enfoque": "La actividad busca enseñar a los niños que no estamos hechos para caminar solos, sino que necesitamos apoyarnos, acompañarnos y ayudarnos mutuamente. A través de los juegos cooperativos aprenderán que trabajar en equipo requiere confianza, paciencia, unidad y disposición para ayudar a los demás.\n\nFundamento bíblico: Eclesiastés 4:9-10.\n\n«Mejores son dos que uno [...] porque si cayeren, el uno levantará a su compañero».\n\nMensaje central: Dios nos enseña que debemos estar atentos a las necesidades de los demás, ofrecer nuestra ayuda cuando alguien cae y aprender a caminar juntos. Así como en los juegos necesitamos de nuestros compañeros para alcanzar una meta, en la vida también podemos ser ese apoyo que alguien necesita para levantarse.", "como": "La jornada se realizará en un espacio amplio, preferiblemente al aire libre, plano y seguro, que permita organizar a los niños en equipos y desarrollar juegos de movimiento sin obstáculos peligrosos. Se delimitará una zona central para la bienvenida, las instrucciones y la reflexión bíblica, y se utilizarán diferentes espacios del mismo lugar para desarrollar los retos.\nOrganización del espacio:\n- Zona central: espacio donde se reunirán todos los niños para la bienvenida, la oración inicial, las instrucciones y la reflexión final.\n- Zona 1 – Captura la bandera: se dividirá el terreno en dos campos, uno para cada equipo, con sus respectivas banderas.\n- Zona 2 – Espalda con espalda: espacio libre donde los niños podrán organizarse en parejas y posteriormente en grupos más grandes.\n- Zona 3 – Caminamos juntos: recorrido corto y delimitado con una línea de salida y una meta.\n- Zona 4 – Tren cooperativo: circuito con conos o botellas para realizar el recorrido en equipo.\n- Zona 5 – No dejes caer la pelota: espacio donde todos puedan formar un círculo y participar.", "mm": [{"a": "08:10", "b": "08:20", "q": "Bienvenida, oración y explicación\nOrganizar a los participantes en un espacio común.\nLos 10 miembros del equipo se presentan y explican que tendrán una mañana de retos y juegos en equipo.\nRealizar una oración antes de comenzar, poniendo la jornada en manos de Dios.\nLeer Eclesiastés 4:9-10 y explicar brevemente que Dios nos enseña a ayudarnos unos a otros.", "p": "David Castaño"}, {"a": "08:20", "b": "08:40", "q": "Juego 1 Captura la bandera: explicación y juego. Dividir a los niños en dos equipos equilibrados.\nEntregar una bandera a cada equipo y delimitar los territorios.\nExplicar que deberán proteger su bandera e intentar capturar la del equipo contrario.\n\n\n\nCuando un niño sea tocado en territorio contrario, deberá sentarse y esperar que un compañero lo ayude a levantarse.\nUna vez rescatado, podrá regresar al juego.\nFinalizar y reunir a los niños para una reflexión corta.. Enseñanza: Cuando alguien cae, no debemos dejarlo solo. Debemos acercarnos y ayudarlo.", "p": "Yeison Hernández"}, {"a": "08:40", "b": "08:55", "q": "Juego 2: Espalda con espalda\n- Organizar a los niños en parejas.\n- Pedirles que se sienten en el suelo espalda con espalda y entrelacen los brazos por los codos.\n- Deben intentar levantarse juntos, coordinando sus movimientos.\n- Después aumentar el desafío formando grupos de tres y cuatro participantes.\n- Finalizar preguntando qué tan difícil habría sido lograrlo sin ayuda.\nEnseñanza: Cuando nos apoyamos y trabajamos juntos, podemos superar dificultades.", "p": "Silvana Caballero"}, {"a": "08:55", "b": "09:10", "q": "Juego 3: Caminamos juntos\n- Organizar a los niños en parejas.\n- Unir suavemente una pierna de cada participante con una cinta de tela.\n- Explicar que deberán coordinar sus pasos para llegar juntos a la meta.\n- Permitirles practicar antes de iniciar.\n- Dar la señal de salida y acompañar el recorrido.\n- Reconocer a las parejas que demuestren paciencia y cooperación.\nEnseñanza: Debemos aprender a escuchar, esperar y avanzar al ritmo de los demás.", "p": "María Alejandra Aguilar"}, {"a": "09:10", "b": "09:25", "q": "Juego 4: El tren cooperativo \nOrganizar grupos de 5 a 8 niños.\n- Formar una fila colocando las manos suavemente sobre los hombros del compañero de adelante.\n- El primero será el conductor del tren.\n- Realizar un recorrido con conos o botellas, haciendo giros y cambios de dirección.\n- Todos deberán avanzar juntos sin separarse.\n- Cambiar al conductor para que otros niños puedan dirigir.\nEnseñanza: Cada integrante es importante y todos debemos avanzar unidos.", "p": "Juan José Lugo"}, {"a": "09:25", "b": "09:35", "q": "Juego 5: ¡No dejes caer la pelota!\n Organizar a todos los niños en un círculo.\n- Entregar una pelota liviana o un globo.\n- El reto consiste en mantenerlo en el aire sin dejarlo caer.\n- Cada niño debe participar al menos una vez.\n- En una segunda ronda, intentar llegar juntos a 15 o 20 golpes sin dejar caer la pelota.\nEnseñanza: Cuando todos aportamos y participamos, podemos alcanzar metas juntos.", "p": "Lizeth Pérez"}, {"a": "09:35", "b": "09:50", "q": "Reunir a todos los niños en círculo.\nLeer nuevamente Eclesiastés 4:9-10.\nPreguntarles qué aprendieron de los juegos.\nEscuchar algunas respuestas.\nCompartir la enseñanza final.\nTerminar con una oración.", "p": "Camila Berruecos"}], "pe": [{"p": "Camila Berruecos", "r": "Coordinación general + Logistica+ enseñanza final"}, {"p": "David Castaño", "r": "Coordinación general+ Logistica+ enseñanza final"}, {"p": "Yeison Hernández", "r": "Captura la bandera"}, {"p": "Silvana Caballero", "r": "Espalda con espalda"}, {"p": "Gabriela Arteaga", "r": "Espalda con espalda"}, {"p": "Sarah Forero", "r": "Espalda con espalda"}, {"p": "María Alejandra Aguilar", "r": "Caminamos juntos"}, {"p": "Lizeth Varón", "r": "Caminamos juntos"}, {"p": "Juan José Lugo", "r": "Tren cooperativo"}, {"p": "Lizeth Pérez", "r": "Pelota cooperativa"}], "jg": [], "ma": [{"i": "Trapillo", "t": "25 metros", "c": 1, "s": "Bogotá", "re": false}, {"i": "2 pañuelos o banderas", "t": "Se usa como bandera", "c": 2, "s": "Bogotá", "re": true}, {"i": "Conos o botellas plásticas (reciclables)", "t": "500 ml", "c": 10, "s": "Quibdó", "re": false}, {"i": "Globo", "t": "Grande", "c": 4, "s": "Bogotá", "re": false}, {"i": "Silbato", "t": "no", "c": 2, "s": "Bogotá", "re": true}, {"i": "Cinta adhesiva para delimitar espacios", "t": "12 mmx20 m", "c": 1, "s": "Bogotá", "re": false}], "lluvia": "¿Dónde se hace?\n- Buscar un salón, corredor amplio o espacio techado que permita reunir a todos los niños.\n- Organizar nuevamente el espacio en una zona central para las instrucciones y los juegos.\n¿Qué se ajusta?\n- Captura la bandera: reemplazarla por un reto de rescate cooperativo en un espacio delimitado, sin carreras.\n- Espalda con espalda: mantener el juego, siempre que el piso sea seco y seguro.\n- Caminamos juntos: realizar el recorrido caminando dentro del espacio cubierto, reduciendo la distancia.\n- Tren cooperativo: adaptar el recorrido con obstáculos sencillos que puedan rodearse sin correr.\n- No dejes caer la pelota: mantener la dinámica en círculo, utilizando un globo o pelota liviana.\n- Priorizar la participación, la cooperación y la enseñanza bíblica sobre la competencia.\n¿Cómo se protegen los materiales?\n- Guardar las banderas, cintas, carteles y demás elementos en bolsas plásticas.\n- Transportar los materiales en cajas o bolsas impermeables.\n- Proteger las pelotas, globos y elementos de papel de la humedad.", "nec": "No"}, {"id": "b3-p2", "b": "b3", "rol": "ninos", "tit": "Parte 2 · \"Jesús me conoce y me recibe\"", "eq": [3], "line": "Dramatización de Marcos 10:13-16 y manualidad, para todos los niños.", "ven": [["10:10", "11:50"]], "notas": ["Parte 2 para todos los niños: 10:10 – 11:50 am. El minuto a minuto viene precargado con los ajustes aprobados; los tiempos son una propuesta.", "La reflexión y la manualidad no se cruzan: primero la reflexión y luego la manualidad.", "Puede que no haya mesas ni sillas: la manualidad se hace sobre cartón o tablas en las piernas, o en el piso.", "Por la regla de equidad: corazones también para el equipo.", "Cierre: coreografía o \"¿Quién soy?\", a discreción de los líderes.", "Conectar con lo que se aprendió en la parte 1 (juntos somos mejores; nos ayudamos).", "Cuidar el lenguaje sobre familia y padres (niños de casa hogar).", "Repartir las tareas que hoy concentra Samuel (por ejemplo, la oración final)."], "estado": "enviada", "act": "17/11/2026 22:38:07", "editor": "Anngie Moreno", "que": "Jesús me conoce y me recibe: una actividad que combina juegos grupales, una representación de Jesús y los niños (Marcos 10:13-16) y una manualidad en la que cada niño hará una tarjeta con el mensaje “Jesús me recibe y me ama”. El propósito es que aprendan sobre el amor de Jesús mientras comparten y se divierten.", "enfoque": "Basada en Marcos 10:13-16, donde Jesús recibe a los niños, la enseñanza transmite tres principios: Jesús nos ama, nos recibe y nos llama a tratar a los demás con amor. Con una representación sencilla, preguntas y ejemplos cotidianos, reforzaremos que ningún niño es insignificante. Frase central: «Jesús tiene un lugar para mí y yo puedo hacerle un lugar a los demás».", "como": "Nos organizamos todos los niños sentados, hacemos los rompehielos y actividades iniciales, se ponen de pie y interactúan con nosotros (de pie y movimientos), luego se sientan y estaremos compartiendo la enseñanza de manera interactiva luego se comparten las indicaciones de la manualidad y cerramos con una reflexión", "mm": [{"a": "10:10", "b": "10:15", "q": "Bienvenida, presentación, armado de grupos y explicación", "p": "Nataly Ruiz"}, {"a": "10:15", "b": "10:25", "q": "Rompehielo \"El saludo diferente\"", "p": "Emanuel Rodríguez"}, {"a": "10:25", "b": "10:35", "q": "Juego \"Sigue al líder\"", "p": "Allisson Domínguez"}, {"a": "10:35", "b": "10:55", "q": "Representación de Marcos 10:13-16", "p": "Samuel Isaacs"}, {"a": "10:55", "b": "11:05", "q": "Reflexión participativa", "p": "Emanuel Rodríguez"}, {"a": "11:05", "b": "11:25", "q": "Manualidad \"Mi lugar con Jesús\"", "p": "Anngie Moreno"}, {"a": "11:25", "b": "11:35", "q": "Reflexión final, aplicación y oración", "p": "Samuel Isaacs"}, {"a": "11:35", "b": "11:47", "q": "Cierre: coreografía o \"¿Quién soy?\" (a discreción de los líderes)", "p": ""}, {"a": "11:47", "b": "11:50", "q": "Entrega de manualidades, agradecimiento y despedida", "p": "Nataly Ruiz"}], "pe": [{"p": "Samuel Isaacs", "r": "Coordina la actividad, prepara y dirige la enseñanza de Marcos 10:13-16, realiza la representación de Jesús, dirige las preguntas de reflexión y realiza la oración final."}, {"p": "Emanuel Rodríguez", "r": "Dirige los juegos rompehielo y \"Sigue al líder\", explica las instrucciones, representa a uno de los personajes de la historia bíblica y dirige el juego de personajes."}, {"p": "Anngie Moreno", "r": "Prepara y dirige la manualidad de los corazones, distribuye los materiales, explica cómo decorar las tarjetas y acompaña a los niños durante su elaboración."}, {"p": "Nataly Ruiz", "r": "Organiza previamente los materiales, prepara el espacio, apoya los juegos, distribuye los elementos necesarios y se encarga de recoger y verificar los materiales al finalizar."}, {"p": "Allisson Domínguez", "r": "Recibe a los niños, ayuda a organizarlos en grupos, verifica que todos participen, acompaña la manualidad y apoya a los niños que necesiten ayuda."}], "jg": [], "ma": [{"i": "Blocs de Cartulinas de Colores", "t": "Carta", "c": 2, "s": "Bogotá", "re": false}, {"i": "Marcadores", "t": "multicolor", "c": 12, "s": "Quibdó", "re": true}, {"i": "Cajas de Colores", "t": "x12", "c": 6, "s": "Quibdó", "re": true}, {"i": "Pegante en barra", "t": "Medianos", "c": 8, "s": "Quibdó", "re": true}, {"i": "Impresion de versiculo", "t": "Marcos 10:14", "c": 40, "s": "Quibdó", "re": false}, {"i": "Cinta de enmascarar", "t": "rollo", "c": 1, "s": "Quibdó", "re": true}, {"i": " Bolsas de Basura", "t": "Un rollo", "c": 1, "s": "Bogotá", "re": true}, {"i": "Tijeras ", "t": "de punta roma", "c": 5, "s": "Quibdó", "re": false}], "lluvia": "Los materiales se pueden ajustar a guardarse en bolsas y ir a otro lugar (incluso en el piso)", "nec": "El transporte de los materiales al lugar de la actividad."}, {"id": "b4-a", "b": "b4", "rol": "ninos", "tit": "Programa A · \"Dios te conoce\" (menores de 10)", "eq": [3, 2, 5], "line": "1 Samuel 3 y el buen pastor, con friso y cajita de peticiones.", "ven": [["13:30", "15:30"]], "notas": ["Para menores de 10 años (corte en 10 años).", "Ajustado al tiempo y reusando materiales (viene precargado).", "Coreografía: a discreción de los líderes."], "estado": "enviada", "act": "17/11/2026 22:41:17", "editor": "Anngie Moreno", "que": "Dios está cerca de ti: se quiere transmitir a los niños que Dios los conoce personalmente, sabe quiénes son, se interesa por ellos y conoce esas cosas que nadie más sabe. Además, al conocerlos tanto ha puesto un propósito especial en la vida de cada uno de ellos.", "enfoque": "Partimos de 1 Samuel 3:1-10, donde Samuel escucha la voz de Dios, y lo conectamos con Juan 10:3-4, donde Jesús, el Buen Pastor, llama a sus ovejas por su nombre. Queremos que los niños comprendan que Dios los conoce personalmente, que pueden acercarse a Él y aprender a reconocer su voz, y que su vida tiene un propósito desde ahora; no necesitan esperar a ser adultos para caminar con Él.\n", "como": "Bienvenida: recibimos a los niños por medio de un saludo especial. Los recibimos, les preguntamos su nombre y tenemos una lista con la forma en la que quieren ser saludados, deben escoger una de estas opciones: choca esos 5, abrazo, choca el puño, saludo con la mano, apretón de manos o se invita a que cree un nuevo saludo. De fondo suenan canciones, esto con hacer de la bienvenida algo diferente, pero si por el contrario, es algo más casual podemos simplemente recibirlos y ubicarlos en el espacio.\nJuegos rompehielos: \nJuego 1: se inicia separando a los niños en una cantidad equitativa por grupos. Cada grupo se toma de las manos y el juego consiste en pasar un ula ula por su cuerpo sin separarse, se debe trabajar en equipo. (Opciones competencia entre grupos).\nJuego 2: conservando el mismo círculo, se jugará tingo tingo tango pasando una pelota, el líder hará preguntas al niño fáciles cómo: su nombre y comida favorita, animal favorito, que quiere ser cuando grande (preguntas de interés para conocerlos) y también pequeños retos que lo haga más divertido.\nJuego 3: conservando el círculo, se dará la indicación de que cada persona del círculo debe preparar un paso de baile fácil, en cada turno la persona debe decir su nombre, mostrar su paso, y la persona siguiente debe hacer el paso anterior y su nuevo paso. \nJuego grupal Charadas: para empezar a introducir el mensaje de ¿Quién soy? Y Dios conoce mi nombre, jugaremos con todos charadas, los maestros y luego niños que quieran pasar, deben tomar una palabra de una bolsa y sin decir ninguna palabra hacer gestos para que las demás personas adivinen su personaje. Los papeles pueden contener nombre de animales, objetos, películas y comidas. Terminamos diciendo que Dios conoce nuestro nombre así como nosotros conocimos los nombres en este juego\nRepresentación teatral de 1 Samuel 3: 1-10. De manera corta y sencilla se representa el llamado de Dios a Samuel y un maestro da una pequeño mensaje explicando lo que pasó, por qué y como es aplicable a sus vidas sabiendo que Dios conoce sus nombres y los ha llamado por una razón\nRepresentación teatral el buen pastor,como acto seguido de la representación anterior se inicia con una persona vestida de pastor, se les pregunta a los niños que hace esta persona, otra u otras personas con una pequeña personificación de ovejas andan por el lugar y el pastor las trae de vuelta, las ovejas hablan y dicen porque se fueron (situaciones que los niños puedan sentir), se llega a la reflexión de que el pastor las buscó y las trajó de nuevo a su rebaño. Se termina orando en dirección a estas enseñanzas\nBaile: \"Jesús mi salvador\"  Una persona inicia enseñando los pasos sin música, avanza poco a poco con pequeños fragmentos de la canción enseñando a los niños el baile, hasta el final bailarla por completo. Se termina una pequeña reflexión del significado de la canción de libertad y como somos libres en relación con las enseñanzas anteriores\nActividad artística: La idea es que los niños se puedan llevar un friso a su casa, donde cada una de sus caras, se pueda personalizar\nLado 1: El niño pone de manera creativa su nombre\nLado 2: Aparece la figura de Jesús y al lado un avatar para personalizar, el niño debe decorarlo a su gusto\nLado 3: Espacio en blanco para dibujar sus gustos (comida favorita, animal favorito, algún sueño que tengan)\nLado 4: Espacio para escribir algo a Dios, preguntarle algo, pedir por algo, agradecer por algo\nAl final pasamos una cajita cerrada con un orificio donde les explicamos que pueden poner de forma anónima una oración a Dios, ya sea escrito, por medio de in dibujo y que nosotros nos llevaremos esa cajita con sus peticiones para orar por ellos\nLuego preguntamos si algunos quieren compartir su friso con los demás, hacemos preguntas y finalizamos con la pregunta: ¿Qué te llevas de la enseñanza?\nTerminamos orando, agradeciendo por venir y despidiéndonos. \n", "mm": [{"a": "13:30", "b": "13:40", "q": "Bienvenida con saludo especial (lista de saludos), nombres y armado de los grupos", "p": "Todo el equipo"}, {"a": "13:40", "b": "13:55", "q": "Juegos rompehielos", "p": "Todo el equipo"}, {"a": "13:55", "b": "14:05", "q": "Juego grupal Charadas: para empezar a introducir el mensaje de ¿Quién soy?", "p": "Todo el equipo"}, {"a": "14:05", "b": "14:25", "q": "Representación de 1 Samuel 3:1-10 y mensaje", "p": "Yeison Hernández"}, {"a": "14:25", "b": "14:40", "q": "El buen pastor y oración", "p": "David Castaño"}, {"a": "14:40", "b": "15:15", "q": "Manualidad: friso de 2 lados (nombre; Jesús con avatar) + cajita de peticiones anónimas + compartir", "p": "Todo el equipo"}, {"a": "15:15", "b": "15:30", "q": "Reflexión final (\"¿Qué te llevas?\"), oración y despedida", "p": "Anngie Moreno"}], "pe": [{"p": "Nataly Ruiz", "r": "Diseña y lleva el material (palabras charadas y guías impresas). Supervisa la actividad de acuerdo a su rol"}, {"p": "Allisson Domínguez", "r": "Prepara y enseña el baile con pasos fáciles y repetitivos. Supervisa la actividad de acuerdo a su rol"}, {"p": "Anngie Moreno", "r": "Supervisa la actividad de acuerdo a su rol.Resumen del mensaje central"}, {"p": "Samuel Isaacs", "r": "Acompañamiento en las actividades. Prepara actuación corta. Resumen del mensaje central"}, {"p": "Emanuel Rodríguez", "r": "Acompañamiento en las actividades"}, {"p": "Camila Berruecos", "r": "Saludo de bienvenida y acompañamiento en las actividades"}, {"p": "Gabriela Arteaga", "r": " Acompañamiento en las actividades"}, {"p": "Yeison Hernández", "r": "Acompañamiento en las actividades, participación en la representación teatral sobre Samuel y Dios"}, {"p": "María Alejandra Aguilar", "r": "Acompañamiento en las actividades, participación teatral el Buen Pastor"}, {"p": "Lizeth Pérez", "r": "Acompañamiento en las actividades, acompañamiento del baile "}, {"p": "David Castaño", "r": "Acompañamiento en las actividades, participación teatral el Buen Pastor"}, {"p": "Sarah Forero", "r": "Acompañamiento en las actividades, participación teatral el Buen Pastor"}, {"p": "Juan José Lugo", "r": "Acompañamiento en las actividades"}, {"p": "Lizeth Varón", "r": "Acompañamiento en las actividades, participación en el final de la actividad (preguntas, cierre)"}, {"p": "Silvana Caballero", "r": "Acompañamiento en las actividades, participación teatral el Buen Pastor"}], "jg": [], "ma": [{"i": "Hoja impresa con saludos", "t": "Carta", "c": 3, "s": "Bogotá", "re": false}, {"i": "Hula hula", "t": "Normal", "c": 4, "s": "Quibdó", "re": true}, {"i": "Pelota", "t": "Pequeña", "c": 4, "s": "Quibdó", "re": true}, {"i": "Hojas para el friso", "t": "Carta", "c": 70, "s": "Bogotá", "re": false}, {"i": "Cajas de colores", "t": "Las que se usan en la mañana (Bloque 3)", "c": 6, "s": "Ya lo tenemos", "re": true}, {"i": "Cajita de peticiones", "t": "Caja reutilizada", "c": 1, "s": "Ya lo tenemos", "re": true}, {"i": "Bolsas de basura", "t": "Grandes", "c": 5, "s": "Bogotá", "re": true}, {"i": "Cobija ", "t": "pequeña", "c": 1, "s": "Prestado", "re": false}, {"i": "hojas blancas ", "t": "carta", "c": 10, "s": "Quibdó", "re": false}], "lluvia": "Se protegen los materiales en bolsas de basura, las actividades podrían realizarse en el lugar que dispongamos y en caso de que no podamos usar las hojas, podemos reemplazar esto por que cada persona del grupo haga círculos con poco número de personas y poder entablar una conversación con la información que saldría en el friso, poder hacerlo de forma lúdica y sin usar las hojas de Papel", "nec": "Parlante "}, {"id": "b4-b", "b": "b4", "rol": "ninos", "tit": "Programa B · Mar Rojo (mayores de 10)", "eq": [4, 1], "line": "Dramatización de Éxodo 14 y hoja doblada.", "ven": [["13:30", "15:30"]], "notas": ["Para mayores de 10 años.", "Adaptar la idea para un perfil de mayores de 10 años.", "Dramatización conjunta de los dos equipos.", "Repartir responsabilidades entre los dos equipos.", "Coreografía: a discreción de los líderes."], "estado": "modificada", "act": "17/11/2026 19:51:26", "editor": "Laura Hincapie", "que": "Que los niños aprendan a confiar en Dios aun a pesar de las circunstancias. Que entiendan que Él está dispuesto a ayudarles, solo es que ellos confíen en El.", "enfoque": "Moisés y el paso por el Mar Rojo — Éxodo 14.", "como": "1. Bienvenida y rompehielos\nActividad 1: Di la palabra contraria\nDirigida por: Manuela Cárdenas.\nSe les explica a los niños que se dirá una palabra y ellos deberán responder rápidamente con su contrario.\nEjemplos:\n- Vaca: Toro.\n- Arriba: Abajo.\n- Frío: Caliente.\n- Día: Noche.\n- Grande: Pequeño.\n- Cerca: Lejos.\nActividad 2: ¡Protege tu bomba!\nDirigida por: Samuel Carrillo.\nA cada niño se le amarrará una bomba a la cintura. Cuando se dé la señal de inicio, todos deberán intentar estallar las bombas de sus compañeros, mientras protegen la propia.\nEl ganador será el niño que logre conservar su bomba sin estallar hasta el final.\n\nEl equipo acompaña el rompehielos con los niños\n2. Enseñanza bíblica: Moisés y el paso por el mar Rojo\nDirigida por: Isabella Beltrán.\nSe dará inicio a la enseñanza contando de manera dinámica la historia de Moisés y cómo Dios abrió el mar Rojo para que el pueblo de Israel pudiera cruzar y escapar de los egipcios.\nDurante la narración se buscará generar conversación e interacción con los niños, haciéndoles preguntas que les permitan identificarse con la situación que vivió el pueblo de Israel.\nEl equipo cuida de los niños y los incentiva a participar. \n3. Actividad: Colorea\nAl finalizar la enseñanza, se entregará a cada niño un dibujo que represente la historia de Moisés y el paso por el mar Rojo para que puedan colorearlo.\nEn el dibujo o en el espacio destinado para escribir, cada niño completará las siguientes frases:\n\n- Cuando tenga miedo, recordaré que...\n- Dios me acompaña cuando...\n- No estoy solo, Dios está conmigo porque...\n\"No estoy solo, Dios está conmigo\"\n\nTodo el equipo acompaña la actividad con los niños\n4. Oración final - Diego Duran ", "mm": [{"a": "13:30", "b": "13:40", "q": "Llegada de los niños, división por edad", "p": "Todo el equipo"}, {"a": "13:40", "b": "13:50", "q": "Rompehielos: Diga la palabra contraria ", "p": "Manuela Cárdenas"}, {"a": "13:50", "b": "14:10", "q": "Rompehielos: Estalla la bomba", "p": "Samuel Carrillo"}, {"a": "14:10", "b": "14:40", "q": " Enseñanza: Moisés y el paso por el Mar Rojo — Éxodo 14.", "p": "Isabella Beltrán"}, {"a": "14:40", "b": "14:50", "q": "Conversación sobre la enseñanza", "p": "Isabella Beltrán"}, {"a": "14:50", "b": "15:15", "q": "Manualidad: Colorea y recuerda ", "p": "Todo el equipo"}, {"a": "15:15", "b": "15:30", "q": "Cierre, oración y despedida", "p": "Diego Durán"}], "pe": [{"p": "Isabella Beltrán", "r": "Coordinación general de la actividad"}, {"p": "Daniel Moreno", "r": "apoyo a isabella en la enseñanza y en la actividad"}, {"p": "Samuel Carrillo", "r": "apoyo a isabella en la enseñanza y en la actividad"}, {"p": "Alejandra Hernández", "r": "apoyo a isabella en la enseñanza y en la actividad"}, {"p": "Natalia Casallas", "r": "apoyo a isabella en la enseñanza y en la actividad"}], "jg": [], "ma": [{"i": "Hojas con el dibujo impreso", "t": "Carta, blanco y negro (1 impresión, el resto foto copia)", "c": 40, "s": "Bogotá", "re": false}, {"i": "Colores", "t": "Los que se usan el sabado", "c": 4, "s": "Ya lo tenemos", "re": true}, {"i": "Paquete bombas", "t": "Paquete x 100", "c": 1, "s": "Bogotá", "re": false}, {"i": "Lana", "t": "100gr (Se reutiliza-Taller salud mental)", "c": 1, "s": "Bogotá", "re": false}, {"i": "Caja de cartón", "t": "Reciclables", "c": 10, "s": "Quibdó", "re": false}, {"i": "Lapiz", "t": "Caja x12 (Se reutiliza )", "c": 3, "s": "Bogotá", "re": true}], "lluvia": "El programa se puede hacer en un espacio cerrado", "nec": ""}, {"id": "b5-nin", "b": "b5", "rol": "ninos", "tit": "La mejor noticia", "eq": [1, 2], "line": "Lucas 2:10-11 con un mural colectivo.", "ven": [["16:30", "17:15"]], "notas": ["Son niños del sector, no los mismos niños de la fundación.", "¿Cómo sería el mural? ¿Sobre qué iría apoyado? ¿Con qué se decoraría o qué se le pone?"], "estado": "modificada", "act": "17/11/2026 19:50:45", "editor": "Laura Hincapie", "que": "Enfocaremos la actividad central sobre las buenas noticias, construiremos un mural colectivo en el que los niños plasmaran cual lo aprendido sobre el amor de Dios.", "enfoque": "A través de Lucas 2:10-11, enseñaremos que Jesús es la mejor noticia que podemos recibir, porque a través de El conocemos el amor de Dios, encontramos esperanza y salvación y hablaremos de la importancia de compartirlo con otros. La narración será dinámica y participativa, acoplándose a las edades de los niños.", "como": "1. Se cuenta la historia de Jesús de su nacimiento haciendo énfasis en Lucas 2:10-11 reconociendo que Jesús vino al mundo para traernos salvación, esperanza y una alegría que todos podemos recibir. \nDiego Duran - Gabriela Arteaga narran la historia \n El resto del equipo se aseguran del orden de los niños\n2.Realizacion del mural \nPara el desarrollo de esta actividad se organizarán 7 grupos de niños, cada uno acompañado por una persona responsable.\nCada miembro del equipo tendrá la función de recibir, orientar y acompañar a los niños dependiendo la edad durante la dinámica, ayudándolos a identificar y expresar una buena noticia por medio de un post-it.\nLos niños podrán escribir o dibujar aquello que consideran una buena noticia en sus vidas. Posteriormente, cada uno pegará su mensaje en el mural colectivo.\nFinalmente, se enfatizará que la noticia más grande es que Jesús vino al mundo porque nos ama.\nLaura Hincapie-Camila Berruecos (Dirigen la actividad)\n\nOpcional: Huellas de buenas noticias \nCombinar las huellas de colores de sus manos con los post-its. Las huellas representan a los niños y los post-its representan las buenas noticias que quieren compartir.", "mm": [{"a": "16:30", "b": "16:40", "q": "Enseñanza bíblica sobre la buena noticia y amor de Dios", "p": "Diego Durán"}, {"a": "16:40", "b": "17:05", "q": "Mural : post-its y huellas de buenas noticias ", "p": "Camila Berruecos"}, {"a": "17:05", "b": "17:15", "q": "Oración y despedida", "p": "Juan Sebastián Bonilla"}], "pe": [{"p": "Diego Durán", "r": "Narrar la historia del nacimiento de Jesús, Equipo 6 de niños dirigido"}, {"p": "Gabriela Arteaga", "r": "Narrar la historia del nacimiento de Jesús, Equipo 7 de niños dirigido por:"}, {"p": "Laura Hincapie", "r": "Dirige mural"}, {"p": "Camila Berruecos", "r": "Dirige mural"}, {"p": "Manuela Cárdenas", "r": "Equipo 1 de niños dirigido por:"}, {"p": "Juan Sebastián Bonilla", "r": "Equipo 2 de niños dirigido por:"}, {"p": "Yeison Hernández", "r": "Equipo 3 de niños dirigido por:"}, {"p": "María Alejandra Aguilar", "r": "Equipo 4 de niños dirigido por:"}, {"p": "Lizeth Pérez", "r": "Equipo 5 de niños dirigido por:"}], "jg": [], "ma": [{"i": "Carton piedra ", "t": "pliego", "c": 1, "s": "Quibdó", "re": false}, {"i": "Pinturas vinilo", "t": "80 gramos", "c": 5, "s": "Quibdó", "re": false}, {"i": "post-its ", "t": "76*76 mm *100 hojas ", "c": 1, "s": "Bogotá", "re": false}, {"i": "Lapiz", "t": "caja X12", "c": 3, "s": "Bogotá", "re": true}, {"i": "Paquete Plato desechable para pintura", "t": "NA", "c": 1, "s": "Quibdó", "re": false}, {"i": "Pañitos húmedos ", "t": "Paquete X100", "c": 1, "s": "", "re": false}, {"i": "Cinta transparente", "t": "Ancha", "c": 1, "s": "Quibdó", "re": true}], "lluvia": "Esta actividad se puede realizar en cualquier espacio", "nec": "No "}, {"id": "b5-bom", "b": "b5", "rol": "conexion", "tit": "Tablero de bombas", "eq": [3], "line": "Bombas con mensajes de Dios y dardos; luego conversación y oración.", "ven": [["16:30", "17:15"]], "notas": ["¿Cómo se armaría el tablero? Incluir su costo.", "Preparar mínimo 50 mensajes.", "Con dardos.", "Traer bombas y mensajes listos desde antes.", "Los materiales vienen precargados como paquetes (cantidad 1 por paquete), porque en la ficha anterior los valores eran el total de cada elemento."], "estado": "enviada", "act": "17/11/2026 22:42:23", "editor": "Anngie Moreno", "que": "1 ableros grandes lleno de bombas, y dentro de cada una hay un mensaje con una palabra de Dios que preparamos en oración con anticipación. Cada persona lanza un dardo, revienta una bomba y se lleva el mensaje que le tocó. Desde ahí empezamos a conversar y a orar por ella.", "enfoque": "Antes del viaje oramos y escribimos en post-its los versículos que Dios nos dé, para meterlos en las bombas. Cada integrante acompaña a una persona de principio a fin: la invita a jugar, después leen juntos el mensaje, le pregunta qué significa para ella o cómo le habla en este momento de su vida, y le ofrece orar por ella con una oración corta y personal.", "como": "Nos organizamos a un lado del equipo de alabanza y organizamos el tablero o la tabla con su soporte y las bombas distribuidas por todo el tablero. Se va llamando a la gente, invitándola a participar en una dinámica por un dulce. Cuando una persona decía participar el miembro del equipo que haga contacto primero con ella lo acompañará durante todo el juego y al final hablará con la persona sobre el versículo. La palabra que salió en la bomba, preguntándole si hace sentido para lo que esté viviendo en su vida, y si hay algo en específico, por lo que quiera que sea rápidamente. Lo mismo harán todos los miembros del equipo.", "mm": [{"a": "16:30", "b": "17:15", "q": "Actividad tablero bombas", "p": "Anngie Moreno"}], "pe": [{"p": "Anngie Moreno", "r": "Antes del viaje: prepara 30 mensajes.En la actividad: invita a las personas, les entrega el dardo, celebra con ellas, lee el mensaje, conversa y ora. Cuando no está con alguien, repone bombas. También está pendiente de los tiempos."}, {"p": "Allisson Domínguez", "r": "Antes del viaje: prepara 30 mensajes. En la actividad: invita a las personas, les entrega el dardo, celebra con ellas, lee el mensaje, conversa y ora. Cuando no está con alguien, repone bombas"}, {"p": "Emanuel Rodríguez", "r": "Antes del viaje: prepara 30 mensajes. En la actividad: invita a las personas, les entrega el dardo, celebra con ellas, lee el mensaje, conversa y ora. Cuando no está con alguien, repone bombas"}, {"p": "Samuel Isaacs", "r": "Antes del viaje: prepara 30 mensajes. En la actividad: invita a las personas, les entrega el dardo, celebra con ellas, lee el mensaje, conversa y ora. Cuando no está con alguien, repone bombas"}, {"p": "Nataly Ruiz", "r": "Antes del viaje: prepara 30 mensajes. En la actividad: invita a las personas, les entrega el dardo, celebra con ellas, lee el mensaje, conversa y ora. Cuando no está con alguien, repone bombas"}], "jg": [], "ma": [{"i": "Bombas", "t": "Paquete de 50, número 9, multicolor", "c": 3, "s": "Bogotá", "re": false}, {"i": "Post-its", "t": "Paquete de 200, cuadrados", "c": 1, "s": "Bogotá", "re": false}, {"i": "Cartulina blanca", "t": "2 pliegos", "c": 1, "s": "Quibdó", "re": false}, {"i": "Marcadores", "t": "5 permanentes gruesos, colores variados", "c": 1, "s": "Quibdó", "re": true}, {"i": "Cinta en rollo", "t": "2 rollos, industrial gruesa", "c": 1, "s": "Quibdó", "re": true}, {"i": "Dardos", "t": "", "c": 6, "s": "Ya lo tenemos", "re": false}, {"i": "Bolsas de basura (almacenar globos)", "t": "4 grandes", "c": 1, "s": "Quibdó", "re": false}, {"i": "Tablero o tabla ", "t": "Grande de 1 metro de largo ", "c": 1, "s": "Prestado", "re": true}, {"i": "Soporte tablero o sillas para sostener la tabla ", "t": "acorde al tablero ", "c": 1, "s": "Prestado", "re": true}], "lluvia": "Vamos casa por casa diciéndoles a las personas que elijan la bomba de color que quieran (hay un mensaje de parte de Dios para ellos) y a partir de ahí conversamos y oramos por ellos.", "nec": "Parlante o megafono para invitar a la gente a que participe. Tablero o tabla grande, con caballete o soporte."}, {"id": "b5-sob", "b": "b5", "rol": "conexion", "tit": "Sobres por necesidad", "eq": [5], "line": "Sobres de colores según la necesidad y cajita de preguntas.", "ven": [["16:30", "17:15"]], "notas": ["Asegurarse de traer una cantidad suficiente de sobres para que no vayan a faltar (mínimo 50).", "Especificar bien los costos.", "Describir mejor los roles y el espacio. ¿Necesitan una mesa? ¿Sillas?"], "estado": "enviada", "act": "17/11/2026 16:35:52", "editor": "David Castaño", "que": "Cartas de perspectiva - Una conversación espiritual", "enfoque": "Se instalará un pequeño espacio con sobres y dinamicas evangelisticas de diferentes colores que representen necesidades como esperanza, paz, fortaleza, amor y perdón. Cada persona podrá elegir un sobre y descubrirá en su interior un mensaje bíblico. Un servidor se acercará para conversar sobre el mensaje, escuchar a la persona y ofrecer una oración si lo desea.\nAsí como Jesús aprovechó un momento cotidiano de paso junto a un pozo para hacer una pregunta sencilla (\"Dame de beber\") y abrir una conversación profunda sobre la sed del alma sin juzgar, esta actividad usa las cartas como un puente de gracia. El objetivo no es predicar desde arriba, sino practicar la hospitalidad espiritual: detenerse a escuchar la historia del otro con amor (\"pronto para oír, tardo para hablar\", Santiago 1:19), permitiendo que sea Dios quien hable al corazón de cada persona a través de la reflexión.", "como": "Cómo funciona la dinámica\n\n1. La baraja y las categorías: El material consiste en un set de cartas ilustradas que abordan diferentes temas relacionados con la cosmovisión (como la naturaleza de Dios, la humanidad, el propósito de la vida, la identidad de Jesús o la fuente de la verdad espiritual).\n2. Elección de tarjetas: En cada categoría o tema, los participantes revisan las imágenes y eligen la tarjeta que mejor representa lo que creen.\n3. Explicación y escucha (sin juicios): Una vez que la persona selecciona su carta, se le invita a compartir por qué eligió esa imagen y qué significa para ella. El rol principal de quien guía la conversación es escuchar activamente, hacer buenas preguntas y validar el sentir del otro sin atacar ni corregir de inmediato.\n4. Un puente hacia el diálogo profundo: Al parecerse a una dinámica lúdica o un juego, reduce la tensión de hablar sobre temas abstractos, religiosos o íntimos. Permite descubrir cuáles son los verdaderos bloqueos o dudas de la otra persona y abre una puerta natural para compartir la perspectiva propia (por ejemplo, la fe cristiana) de forma auténtica.", "mm": [{"a": "16:30", "b": "17:15", "q": "Una pausa para el alma\nFase 1: Aproximación y Sintonización (Minuto 0 al 2)\nQué sucede: La persona se acerca a la mesa o se sienta de forma espontánea.\n\nQué hace el facilitador: Rompe el hielo con empatía preguntando \"¿Cómo va el día hoy?\". Luego explica brevemente el propósito: \"Esto no es adivinación ni tarot; son cartas de perspectiva. La idea es elegir una al azar para ver qué nos refleja sobre cómo estamos viviendo o qué necesitamos escuchar hoy.\"\n\nFase 2: Elección y Observación (Minuto 2 al 4)\nQué sucede: Se establece la conexión interior de la persona con el mazo.\n\nQué hace el facilitador: Pide a la persona que respire hondo, piense en cómo está su corazón en este momento y elija una carta de la mesa. Luego, le da un minuto de silencio para contemplarla: \"Mira la imagen, los colores, las palabras. Sin sobrepensarlo, ¿qué es lo primero que te evoca?\"\n\nFase 3: La Conversación Espejo - El núcleo (Minuto 4 al 8)\nQué sucede: Se abre un espacio de escucha profunda y diálogo breve.\n\nQué hace el facilitador: Lanza una o dos preguntas sencillas y directas adaptadas al momento:\n\n¿Qué parte de tu vida diaria se parece a esta imagen o a lo que sientes al verla?\n\nSi esta carta fuera un consejo para ti hoy, ¿qué te diría?\n\nPostura clave: Escucha con total presencia y sin interrumpir. En la calle casi nadie escucha sin juzgar; valida lo que dice con frases como \"Qué fuerte eso que dices\" o \"Gracias por compartirlo\".\n\nFase 4: Cierre y Despedida (Minuto 8 al 10)\nQué sucede: Se despide al participante de forma cálida y respetuosa de su tiempo.\n\nQué hace el facilitador: Agradece profundamente su apertura y su tiempo. Puedes dejar que se lleve la reflexión grabada en su mente o regalarle un pequeño deseo o bendición para el resto de su camino antes de que continúe su ruta.", "p": "David Castaño"}, {"a": "16:30", "b": "17:15", "q": "Una pausa para el alma\nFase 1: Aproximación y Sintonización (Minuto 0 al 2)\nQué sucede: La persona se acerca a la mesa o se sienta de forma espontánea.\n\nQué hace el facilitador: Rompe el hielo con empatía preguntando \"¿Cómo va el día hoy?\". Luego explica brevemente el propósito: \"Esto no es adivinación ni tarot; son cartas de perspectiva. La idea es elegir una al azar para ver qué nos refleja sobre cómo estamos viviendo o qué necesitamos escuchar hoy.\"\n\nFase 2: Elección y Observación (Minuto 2 al 4)\nQué sucede: Se establece la conexión interior de la persona con el mazo.\n\nQué hace el facilitador: Pide a la persona que respire hondo, piense en cómo está su corazón en este momento y elija una carta de la mesa. Luego, le da un minuto de silencio para contemplarla: \"Mira la imagen, los colores, las palabras. Sin sobrepensarlo, ¿qué es lo primero que te evoca?\"\n\nFase 3: La Conversación Espejo - El núcleo (Minuto 4 al 8)\nQué sucede: Se abre un espacio de escucha profunda y diálogo breve.\n\nQué hace el facilitador: Lanza una o dos preguntas sencillas y directas adaptadas al momento:\n\n¿Qué parte de tu vida diaria se parece a esta imagen o a lo que sientes al verla?\n\nSi esta carta fuera un consejo para ti hoy, ¿qué te diría?\n\nPostura clave: Escucha con total presencia y sin interrumpir. En la calle casi nadie escucha sin juzgar; valida lo que dice con frases como \"Qué fuerte eso que dices\" o \"Gracias por compartirlo\".\n\nFase 4: Cierre y Despedida (Minuto 8 al 10)\nQué sucede: Se despide al participante de forma cálida y respetuosa de su tiempo.\n\nQué hace el facilitador: Agradece profundamente su apertura y su tiempo. Puedes dejar que se lleve la reflexión grabada en su mente o regalarle un pequeño deseo o bendición para el resto de su camino antes de que continúe su ruta.", "p": "Lizeth Varón"}], "pe": [{"p": "David Castaño", "r": "Actividad y dinamicas"}, {"p": "Lizeth Varón", "r": "Evangelización"}, {"p": "Sarah Forero", "r": "Apoyo actividades y dinamicas"}, {"p": "Silvana Caballero", "r": "Apoyo evangelización"}, {"p": "Juan José Lugo", "r": "Apoyo evangelización"}], "jg": [], "ma": [{"i": "Papel iris con mensajes y tratados", "t": "unidad", "c": 25, "s": "Ya lo tenemos", "re": false}, {"i": "juego con dinamicas evangelisticas", "t": "juego", "c": 1, "s": "Ya lo tenemos", "re": true}, {"i": "Mesa", "t": "Mediana promedio, de plástico.", "c": 1, "s": "Ya lo tenemos", "re": true}, {"i": "Sillas (Prestadas del lugar)", "t": "Unidad", "c": 4, "s": "Ya lo tenemos", "re": false}], "lluvia": "Podría hacerse en un refugio que encontremos. Si no cabe la mesa podríamos hacerlo sin ella, en últimas. pondríamos las cartas en su empaque, aunque podríamos seguirlo haciendo en un espacio cerrado.", "nec": "Transporte de la mesay sillas"}, {"id": "b6-car", "b": "b6", "rol": "conexion", "tit": "Cartel espejo", "eq": [2], "line": "\"Jesús murió por esta persona\", con papel espejo.", "ven": [["9:15", "10:30"]], "notas": ["Revisar los costos para tener todo en cuenta.", "El cartel debe estar hecho antes de llegar a la actividad.", "Evaluar tener más de un cartel por efectividad, según el número de personas.", "La prédica se dará de manera general, pero cada grupo con su espejo puede conversar y sembrar en las personas con las que hable."], "estado": "enviada", "act": "17/11/2026 18:43:07", "editor": "Camila Berruecos", "que": "Llamar la atención con un cartel llamativo para poder generar conversación y poder orar por ellos.", "enfoque": "Con un cartel grande que tenga escrito \"Jesús murió por esta persona\"  y cuando se asome, vea su cara reflejada un papel tipo espejo. Para así poder abrir la conversación de lo que hizo Jesús por ella cuando vino al mundo y la salvación. Y si tiene petición de oración.", "como": "Se realizará en un espacio visible, tranquilo y de fácil acceso para las personas de la comunidad, preferiblemente en un punto de paso de la jornada evangelística.\nSe ubicará un cartel grande y decorado con el mensaje «Jesús murió por esta persona», que tendrá una abertura en el centro cubierta con papel reflectivo tipo espejo, de manera que quien se acerque pueda ver su propio rostro reflejado.\nUn miembro del equipo  invitará a los participantes a acercarse y mirar a través del espejo. Cuando descubran su reflejo, se iniciará una conversación sencilla sobre el amor de Dios, explicando que Jesús vino al mundo, murió en la cruz y resucitó para ofrecernos salvación.\nDespués, se les preguntará si conocían esta historia, si desean aprender más de Jesús o si tienen alguna petición de oración. Finalmente, el voluntario escuchará y, si la persona lo permite, realizará una oración por su vida y sus necesidades.\nLa actividad se desarrollará de manera individual o en pequeños grupos, permitiendo que cada participante tenga un momento de escucha, reflexión y acercamiento a Jesús.", "mm": [{"a": "09:15", "b": "09:20", "q": "Ubicar el cartel con el mensaje «Jesús murió por esta persona», preparar el espejo y disponer un espacio tranquilo para conversar.", "p": "Yeison Hernández"}, {"a": "09:20", "b": "09:30", "q": "Invitacion y bienvenida :Los miembros del equipo se acercan a los adultos de la comunidad y los invitan a participar en una experiencia sobre el amor de Jesús.", "p": "Todo el equipo"}, {"a": "09:30", "b": "09:45", "q": "Dinámica del espejo\tCada participante observa su reflejo en el cartel y descubre que el mensaje está dirigido a él. Se le invita a reflexionar sobre el significado de esa frase.", "p": "Camila Berruecos"}, {"a": "09:45", "b": "10:00", "q": "Compartir el evangelio: Se conversa sobre el amor de Dios, la venida de Jesús al mundo, su muerte en la cruz y su resurrección como fundamento de nuestra salvación. Se comparte Juan 3:16 y Romanos 5:8.", "p": "María Alejandra Aguilar"}, {"a": "10:00", "b": "10:15", "q": "Escucha y conversación personal\tSe brinda un espacio para que los participantes expresen sus pensamientos, inquietudes y experiencias de vida. Se les invita a reflexionar sobre su relación con Dios.", "p": "Gabriela Arteaga"}, {"a": "10:15", "b": "10:25", "q": "Peticiones de oración\tSe pregunta si tienen alguna necesidad personal, familiar o emocional por la que deseen recibir oración. Los voluntarios oran por cada persona que lo permita.", "p": "Lizeth Pérez"}, {"a": "10:25", "b": "10:30", "q": "Cierre y despedida\tSe agradece su participación y se les recuerda que el amor de Jesús está disponible para ellos y que pueden acercarse a Él.", "p": "Yeison Hernández"}], "pe": [{"p": "Camila Berruecos", "r": "Dinámica del espejo"}, {"p": "Yeison Hernández", "r": "Ubicar el cartel con el mensaje y realiza cierre y despedida"}, {"p": "María Alejandra Aguilar", "r": "Compartir el evangelio"}, {"p": "Gabriela Arteaga", "r": "Escucha y conversación personal"}, {"p": "Lizeth Pérez", "r": "Peticiones de oración"}], "jg": [], "ma": [{"i": "Cartulina", "t": "pliego", "c": 4, "s": "Quibdó", "re": false}, {"i": "Láminas Acrílicas Flexibles Para Espejo", "t": "1/8 pliego", "c": 4, "s": "Bogotá", "re": false}, {"i": "Marcador Sharpie Negro grueso ", "t": "Marcador", "c": 1, "s": "Bogotá", "re": true}, {"i": "Soporte o caballete para el cartel (Prestado o carton paja)", "t": "Pliego", "c": 1, "s": "Bogotá", "re": false}, {"i": "Pegante para fijar la lamina espejo (Cinta doble faz)", "t": "cinta", "c": 1, "s": "Bogotá", "re": false}, {"i": "Pliegos papel de colores", "t": "pliego", "c": 2, "s": "Bogotá", "re": false}], "lluvia": "Se puede manejar la tematica bajo la lluvia", "nec": "Si no se consigue el papel de espejo podriamos mirar la opcion de comprar espejos "}, {"id": "b6-tab", "b": "b6", "rol": "conexion", "tit": "Tablero \"Toma lo que necesitas\"", "eq": [1], "line": "Tarjetas con mensajes de esperanza según la necesidad.", "ven": [["9:15", "10:30"]], "notas": ["Ajustar los tiempos al horario general.", "Lista completa de materiales (vienen precargados los del tablero de tu propuesta de evangelismo)."], "estado": "modificada", "act": "17/11/2026 19:26:52", "editor": "Laura Hincapie", "que": "Un tablero interactivo llamado «Toma lo que necesitas», donde las personas podrán elegir una tarjeta con un mensaje de esperanza. Cada tarjeta tendrá dos caras: en el frente, una frase que transmita un mensaje de esperanza de parte de Dios y respaldo, la invitación a participar en la reunión especial.", "enfoque": "Utilizaremos el tablero «Toma lo que necesitas» para atraer a las personas mediante mensajes de esperanza y generar espacios de conversación en los que podamos escuchar sus necesidades y compartir el amor de Dios. Posteriormente, ofreceremos orar por ellas.", "como": "Se realizarán dos tableros para que podamos organizarnos en parejas y acercarnos a las personas. La dinámica consistirá en ir rotando los tableros, de manera que todos los integrantes del equipo tengan la oportunidad de interactuar con diferentes personas, conversar con ellas y orar por sus vidas.\n\nMientras uno de los integrantes conversa con una persona, el otro estará intercediendo constantemente y atento.", "mm": [{"a": "09:15", "b": "09:25", "q": "Llegada, montaje. ", "p": "Todo el equipo"}, {"a": "09:25", "b": "10:30", "q": "Las personas se acercan a tablero \"Toma lo que necesitas\", conversar con las personas en base a su necesidad y oración. Cierre", "p": "Todo el equipo"}], "pe": [{"p": "Laura Hincapie", "r": "Todos participamos conversando con las personas"}
