], "jg": [], "ma": [{"i": "Cartón piedra ", "t": "50 × 70 cm", "c": 2, "s": "Quibdó", "re": true}, {"i": "Sobre blanco cuadrado ", "t": "50 × 14 cm", "c": 2, "s": "Bogotá", "re": true}, {"i": "Paquete marcadores gruesos y permanentes", "t": "NA", "c": 1, "s": "Bogotá", "re": true}, {"i": "Cinta Transparente", "t": "Ancha", "c": 1, "s": "Quibdó", "re": true}, {"i": "Papel fotográfico doble cara", "t": "paquete *20", "c": 1, "s": "Bogotá", "re": false}, {"i": "Impresión a color", "t": "NA", "c": 20, "s": "Bogotá", "re": false}], "lluvia": "Es posible continuar con la actividad dentro de las casas o locales", "nec": ""}, {"id": "b6-nin", "b": "b6", "rol": "ninos", "tit": "Filipenses 4:6-7 + títeres", "eq": [4, 5], "line": "\"No te preocupes, díselo a Dios\": enseñanza con obra de títeres.", "ven": [["9:15", "10:30"]], "notas": ["Rellenar el presupuesto con los títeres prestados de Friends.", "La enseñanza es solo para niños, cuidando el lenguaje.", "Ajustar los tiempos al bloque. Si no cabe, evaluar qué parte se corta (la oración, la coreografía o la actividad manual), ya que no hay espacio de sillas ni mesas.", "La actividad de vasos no va.", "Alinear la representación de los títeres con el mismo tema. La obra debe ser corta: 15 a 20 minutos máximo."], "estado": "enviada", "act": "17/11/2026 16:42:39", "editor": "David Castaño", "que": "Recordarles a los niños y adultos que en vez de preocuparse, pueden decirle a Dios todo lo que necesitan y agradecerle por todo lo bueno, eso les ayudará a tener la paz de Cristo aún en medio de las situaciones difíciles.", "enfoque": "Filipenses 4:6-7 “No se preocupen por nada; en cambio, oren por todo. Díganle a Dios lo que necesitan y denle gracias por todo lo que él ha hecho. Así experimentarán la paz de Dios, que supera todo lo que podemos entender. La paz de Dios cuidará su corazón y su mente mientras vivan en Cristo Jesús.” La enseñanza, actividad manual y oración se relacionan con esto para que los niños comprendan esto.", "como": "Qué pasa: 20 minutos. Juegos de recreación rompehielos: \n1)Simón dice (5 min): Los niños deberán seguir las instrucciones del encargado únicamente cuando diga «Simón dice». \n2) Barcos (5 min): El encargado dirá un número y los niños deberán agruparse rápidamente formando grupos con esa cantidad de integrantes, el juego termina con 4 equipos formados para la siguiente actividad.\n3) Nombre creativo (3 min): Se forman 4 equipos y cada uno deberá ponerse de acuerdo para crear un nombre creativo que los identifique.\n4. Juego de Formemos letras (7 min): El encargado indicará una letra (por ejemplo, la «A») y cada equipo deberá organizarse para representarla utilizando sus cuerpos. El primer equipo que logre formarla correctamente gana. \nActividad con titeres y socialización de la obra\n", "mm": [{"a": "09:15", "b": "09:35", "q": "Juegos rompehielos:\n1)Simón dice (5 min): Los niños deberán seguir las instrucciones del encargado únicamente cuando diga «Simón dice». \n2) Barcos (5 min): El encargado dirá un número y los niños deberán agruparse rápidamente formando grupos con esa cantidad de integrantes, el juego termina con 4 equipos formados para la siguiente actividad.\n3) Nombre creativo (3 min): Se forman 4 equipos y cada uno deberá ponerse de acuerdo para crear un nombre creativo que los identifique.\n4. Juego de Formemos letras (7 min): El encargado indicará una letra (por ejemplo, la «A») y cada equipo deberá organizarse para representarla utilizando sus cuerpos. El primer equipo que logre formarla correctamente gana.\n", "p": "Todo el equipo"}, {"a": "09:35", "b": "09:50", "q": "15 minutos obra de titeres", "p": "Todo el equipo"}, {"a": "09:50", "b": "10:05", "q": "Socialización de la obra y enseñanza", "p": "Todo el equipo"}, {"a": "10:05", "b": "10:15", "q": "Musica y oración guiada: \nSe explicará a los niños qué es la oración y se realizará una oración guiada en base a lo presentado en la obra de teatro. También es la oportunidad para acercarse y orar por cada niño. (Aleja dirije oración", "p": "Alejandra Hernández"}, {"a": "10:15", "b": "10:25", "q": "Entregar recordatorios:\n Entregarles a los niños el versículo impreso y un dulce. Como un recordatorio tangible de lo que aprendieron.", "p": "Todo el equipo"}, {"a": "10:26", "b": "10:30", "q": "Oración final y despedida", "p": "Todo el equipo"}], "pe": [{"p": "Samuel Carrillo", "r": "Dirige paso 1 Recreación"}, {"p": "Silvana Caballero", "r": "Apoya Paso 1 Recreación"}, {"p": "Sarah Forero", "r": "Dirige obra titeres "}, {"p": "David Castaño", "r": "Apoya Obra titeres "}, {"p": "Alejandra Hernández", "r": "Narrador obra, realiza socialización e interactua con los niños "}, {"p": "Juan José Lugo", "r": "Montaje obra titeres (Telón)"}, {"p": "Samuel Carrillo", "r": "Montaje obra titeres (Telón)"}, {"p": "Daniel Moreno", "r": "Oración guiada "}, {"p": "Lizeth Varón", "r": "Oración guiada"}, {"p": "Natalia Casallas", "r": "Reparte dulces y recordatorio con versiculo"}, {"p": "Isabella Beltrán", "r": "Reparte dulces y recordatorio con versiculo"}], "jg": [], "ma": [{"i": "Hoja impresa a color con versiculo (Recordatorio)", "t": "unidad", "c": 15, "s": "Bogotá", "re": false}, {"i": "Paquete de bombom bum", "t": "Paquete", "c": 5, "s": "Bogotá", "re": false}, {"i": "Títeres (Prestados)", "t": "unidad", "c": 2, "s": "Ya lo tenemos", "re": false}, {"i": "Telon ", "t": "unidad", "c": 1, "s": "Ya lo tenemos", "re": false}, {"i": "Cuerda o palos de escoba (Prestados)", "t": "unidad", "c": 2, "s": "Ya lo tenemos", "re": false}], "lluvia": "La activida se puede realizar con lluvia leve, si es lluvia muy fuerte, buscaremos refugio y realizaremos la obra de titeres en un espacio reducido.", "nec": "Transportar titeres, microfono y bafle para el tiempo de oración"}, {"id": "b7-nin", "b": "b7", "rol": "ninos", "tit": "Ruta de exploradores", "eq": [1, 2], "line": "Estaciones con desafíos que terminan con la pulsera de la gracia (Efesios 2:8-9).", "ven": [["14:15", "15:45"]], "notas": ["Máximo 4 a 5 estaciones, con el modelo de Laura como base.", "Revisar el costo de las pulseras: si entra dentro del presupuesto.", "A las 4:00 ayudan a organizar a la gente para el taller."], "estado": "modificada", "act": "17/11/2026 19:47:31", "editor": "Laura Hincapie", "que": "Realizar una experiencia interactiva con temática de exploradores, en la que los niños recorren diferentes estaciones con desafíos, juegos y al finalizar encontraran el tesoro que es una pulsera de colores que representa \"La salvación como regalo de gracia\"", "enfoque": "A través de Efesios 2:8-9, enseñaremos que la salvación es un regalo de Dios que recibimos por gracia mediante la fe en Jesucristo, y que no podemos ganarla por nuestras propias obras. La experiencia permitirá que los niños comprendan, de manera visual y participativa, el amor de Dios, la necesidad de Jesús y como no podemos hacer nada para impresionar a Dios y ganar la salvación.", "como": "Coordina los tiempos y las rotaciones, recibir a los niños e integrarlos en las estaciones (Camila Berruecos-Laura Hincapié)\nEstación 1: Un camino que no podemos recorrer solos: Quien dirige: Yeison Hernandez\nUna persona con los ojos vendados deberá reunir vasos del mismo color siguiendo las instrucciones de un guía que representa al Espíritu Santo, mientras los demás intentan distraerla, simbolizando las voces del mundo que buscan alejarnos del camino de Dios.\nEstacion 2: Simón dice con niveles de dificultad Dirigido por Diego Duran (Dependiendo las edades)\nLos niños deberán intentar realizar pequeños retos que el líder les indique: Ejemplo mantener el equilibrio en un pie, caminar hacia atrás unos pasos o decir el abecedario al revés. Después podrán intentarlo con ayuda de un compañero.\nEstación \n3: La Misión rescate (Dirigido por: Gabriela Arteaga): Todos deben agarrarse de las manos y sin soltarse (el grupo que llegue a la estación) Cada niño tiene un turno. Gana el equipo que logre rescatar el objeto primero, respetando las instrucciones de no soltarse. El objeto base puede ser una pelota o una botella algo que tengamos en el momento. Lo relacionamos, así como nos esforzamos por rescatar un objeto, Jesús vino a buscarnos porque somos valiosos para Él.\nEstación 4: Baila al ritmo de la música Dirigido por Juan Sebastian Bonilla y Lizeth Perez : Todos los niños se distribuyen por el espacio. Cuando suena la música, deben bailar libremente al ritmo de ella. Cuando la música se detiene, todos deben quedarse quietos como estatuas. Cuando vuelve a sonar, deben continuar bailando. Se repite varias veces, cambiando la velocidad y el ritmo de la música.\nEstación 5: La salvación como regalo de gracia (Pulsera) Dirigido por: Manuela Cárdenas, Alejandra Aguilar Narrar lo que Jesús hizo por nosotros para salvarnos \n\nOración y despedida - Manuela Cárdenas\n", "mm": [{"a": "14:15", "b": "14:25", "q": "Explicación de la dinamica", "p": "Camila Berruecos"}, {"a": "14:25", "b": "15:45", "q": "Juego de exploradores 4 equipos 4 estaciones \n", "p": "Todo el equipo"}], "pe": [{"p": "Laura Hincapie", "r": "Dirige el juego"}, {"p": "Camila Berruecos", "r": "Dirige el juego"}, {"p": "Yeison Hernández", "r": "Estación 1: Un camino que no podemos recorrer solos"}, {"p": "Diego Durán", "r": "Estacion 2: Simon dice con niveles de dificultad"}, {"p": "Gabriela Arteaga", "r": "Estación 3:La Mision rescate"}, {"p": "Juan Sebastián Bonilla", "r": "Estación 4: Baila al ritmo de la musica"}, {"p": "Lizeth Pérez", "r": "Estación 4: Baila al ritmo de la musica"}, {"p": "Manuela Cárdenas", "r": "Estación 5: La salvación como regalo de gracia (Pulsera)"}, {"p": "María Alejandra Aguilar", "r": "Estación 5: La salvación como regalo de gracia (Pulsera)"}], "jg": [{"n": "Estación 1: Un camino que no podemos recorrer solos", "d": "Una persona con los ojos vendados deberá reunir vasos del mismo color siguiendo las instrucciones de un guía que representa al Espíritu Santo, mientras los demás intentan distraerla, simbolizando las voces del mundo que buscan alejarnos del camino de Dios.", "p": "Yeison Hernández"}, {"n": "Simon dice con niveles de dificultad", "d": "Los niños deberán intentar realizar pequeños retos que el líder les indique: Ejemplo mantener el equilibrio en un pie, caminar hacia atrás unos pasos o decir el abecedario al revés. Después podrán intentarlo con ayuda de un compañero.", "p": "Diego Durán"}, {"n": "La Mision rescate", "d": "Todos deben agarrarse de las manos y sin soltarse (el grupo que llegue a la estación) Cada niño tiene un turno. Gana el equipo que logre rescatar el objeto primero, respetando las instrucciones de no soltarse .El objeto base puede ser una pelota o una botella algo que tengamos en el momento. Lo relacionamos así como nos esforzamos por rescatar un objeto, Jesús vino a buscarnos porque somos valiosos para Él.", "p": "Gabriela Arteaga"}, {"n": "Baila al ritmo de la musica", "d": "Todos los niños se distribuyen por el espacio. Cuando suena la música, deben bailar libremente al ritmo de ella. Cuando la música se detiene, todos deben quedarse quietos como estatuas. Cuando vuelve a sonar, deben continuar bailando. Se repite varias veces, cambiando la velocidad y el ritmo de la música. Con ayuda de Lizeth Perez", "p": "Juan Sebastián Bonilla"}, {"n": " La salvación como regalo de gracia (Pulsera) ", "d": "Narrar lo que Jesús hizo por nosotros para salvarnos con apoyo de Maria Alejandra Aguilar ", "p": "Manuela Cárdenas"}], "ma": [{"i": "Mostacillas", "t": "rojo, negro, blanco, dorado, verde", "c": 5, "s": "Bogotá", "re": false}, {"i": "Hilo Chino. Para Bisutería Manillas", "t": "0.8mm Rollo X90m Aprox", "c": 2, "s": "Bogotá", "re": false}, {"i": "Vendas o pañoletas", "t": "mediana es para vendar ojos ", "c": 2, "s": "Bogotá", "re": false}, {"i": "Vasos desechables azul y rojos dollarcity", "t": "paquete", "c": 1, "s": "Bogotá", "re": false}, {"i": "Cofre para manillas", "t": "Articulo propio", "c": 1, "s": "", "re": true}, {"i": "Peluche", "t": "Articulo propio", "c": 1, "s": "Bogotá", "re": false}], "lluvia": "En caso de que llueva aplicamos la estación 5 y narramos la salvacion como regalo de gracia y se entregan las pulseras ", "nec": "Parlante para reproducir musica "}, {"id": "b7-con", "b": "b7", "rol": "conexion", "tit": "Olimpiadas de alegría", "eq": [5, 3], "line": "Estaciones recreativas para integrar a la gente.", "ven": [["14:15", "15:45"]], "notas": ["La base es la propuesta de David.", "Solo adultos.", "A las 4:00 ayudan a organizar a la gente para el taller."], "estado": "enviada", "act": "17/11/2026 16:44:09", "editor": "David Castaño", "que": "Olimpiadas de alegria (circuito)", "enfoque": "Se organizarán diferentes estaciones recreativas en las que podrán participar niños, jóvenes y adultos. Algunas pruebas serán: carrera de relevos, encestar pelotas, transportar globos, construir torres y resolver acertijos. Se podrán organizar equipos mixtos para promover la integración entre personas que no se conocen. Al finalizar, se realizará una reflexión sobre la importancia de compartir", "como": "Así quedan las cuatro estaciones de las Olimpiadas de la Alegría:\n1. Estación 1 – Globo y vaso: utilizar el aire de un globo para mover un vaso de un punto a otro.\n2. Estación 2 – Derriba la torre: Se dividiran en dos equipos, el equipo 1 debe contruir la torre, mientras que el equipo 2 debe lanzar una pelota para derribarla, luego de 10 minutos cambiaran, el equipo que haya tenido más vasos en su torre ganará.\n3. Estación 3 – Tricky (triqui): resolver el juego de triqui mediante estrategia y rapidez.\n4. Estación 4 – Teléfono roto: transmitir un mensaje de un participante a otro sin repetirlo ni modificarlo intencionalmente.", "mm": [{"a": "14:15", "b": "14:30", "q": "Montaje y ubicación del espacio con actividades", "p": "Silvana Caballero"}, {"a": "14:30", "b": "15:30", "q": "El poder del aire: Trasladar un vaso de un punto a otro utilizando únicamente el aire de un globo inflado.", "p": ""}, {"a": "14:30", "b": "15:30", "q": "Derriba la torre: Se dividiran en dos equipos, el equipo 1 debe contruir la torre, mientras que el equipo 2 debe lanzar una pelota para derribarla, luego de 10 minutos cambiaran, el equipo que haya tenido más vasos en su torre ganará.", "p": ""}, {"a": "14:30", "b": "15:30", "q": "Triky: Se realizaran dos filas, cuando se cuente 3, tendran que correr para colocar un vaso del color de su equipo en una casilla del triky y volver para que otro lo releve, el equipo que haga triky, gana un punto, el equipo que tenga más puntos gana ", "p": ""}, {"a": "14:30", "b": "15:30", "q": "Telefono roto: En dos filas los equipos deben estar de espaldas al primero, al primero se le indicara un mensaje para que idee una mimica, esa mimica tiene que pasar hasta el último de la fila, quien adivinara que es  que hacer la mimica,", "p": ""}, {"a": "15:30", "b": "15:45", "q": "Recoger las cosas y organizar ", "p": ""}], "pe": [{"p": "Silvana Caballero", "r": "Realiza el montaje de las estaciones y organiza a los chicos que van llegando"}, {"p": "Emanuel Rodríguez", "r": "Apoya el montaje de las estaciones y organiza a los chicos que van llegando"}, {"p": "Sarah Forero", "r": "Dirige actividad el poder del aire: Trasladar un vaso de un punto a otro utilizando únicamente el aire de un globo inflado."}, {"p": "Allisson Domínguez", "r": "Apoya actividad el poder del aire: Trasladar un vaso de un punto a otro utilizando únicamente el aire de un globo inflado."}, {"p": "David Castaño", "r": "Dirige actividad derriba la torre: Se dividiran en dos equipos, el equipo 1 debe contruir la torre, mientras que el equipo 2 debe lanzar una pelota para derribarla, luego de 10 minutos cambiaran, el equipo que haya tenido más vasos en su torre ganará."}, {"p": "Nataly Ruiz", "r": "Apoya actividad derriba la torre: Se dividiran en dos equipos, el equipo 1 debe contruir la torre, mientras que el equipo 2 debe lanzar una pelota para derribarla, luego de 10 minutos cambiaran, el equipo que haya tenido más vasos en su torre ganará."}, {"p": "Juan José Lugo", "r": "Supervisa actividad Triky "}, {"p": "Samuel Isaacs", "r": "Apoya actividad triky"}, {"p": "Lizeth Varón", "r": "Supervisa actividad telefono roto: Telefono roto: En dos filas los equipos deben estar de espaldas al primero, al primero se le indicara un mensaje para que idee una mimica, esa mimica tiene que pasar hasta el último de la fila, quien adivinara que es  que hacer la mimica,"}, {"p": "Anngie Moreno", "r": "Supervisa actividad telefono roto: Telefono roto: En dos filas los equipos deben estar de espaldas al primero, al primero se le indicara un mensaje para que idee una mimica, esa mimica tiene que pasar hasta el último de la fila, quien adivinara que es  que hacer la mimica,"}], "jg": [], "ma": [{"i": "vasos grandes", "t": "paquete de 10", "c": 2, "s": "Bogotá", "re": true}, {"i": "Pelota plastico", "t": "pequeña ", "c": 3, "s": "Quibdó", "re": false}, {"i": "Globos ", "t": "paquete x 12", "c": 1, "s": "Quibdó", "re": true}, {"i": "Cinta enmascarar ", "t": "rollo", "c": 1, "s": "Quibdó", "re": false}, {"i": "fichas  bibliograficas", "t": "paquete x 100", "c": 1, "s": "Quibdó", "re": true}, {"i": "Esferos ", "t": "Caja x12", "c": 1, "s": "Quibdó", "re": true}, {"i": "5 fichas con frases cortas escritas (Telefono roto)", "t": "unidad", "c": 5, "s": "Ya lo tenemos", "re": false}, {"i": "Vasos 2 colores", "t": "paquete x10", "c": 1, "s": "Quibdó", "re": false}], "lluvia": "la actividad se puede hacer en un espacio con lluvia leve, si la lluvia es muy fuerte, buscaremos un refugio y reduciremos el espacio de las actividades (Triky, telefono roto)", "nec": ""}, {"id": "b8-adu", "b": "b8", "rol": "conexion", "tit": "Cuerda de tres hilos (adultos)", "eq": [4, 1], "line": "Dios en el centro del hogar (Eclesiastés 4:9-12).", "ven": [["16:00", "16:45"]], "notas": ["Eliminar todo lo relacionado con niños: ellos tienen su propia actividad con los equipos 3 y 5.", "Pueden usar la misma actividad, o que el equipo 1 la enriquezca con una segunda actividad dentro del mismo espacio, enseñando otro principio práctico relacionado con la salud mental después del terremoto.", "Un solo grupo de adultos."], "estado": "modificada", "act": "17/11/2026 19:28:09", "editor": "Laura Hincapie", "que": "Queremos que las familias entiendan que cuando Dios está en el centro del hogar, la familia se mantiene unida, como una cuerda de tres hilos que no se rompe fácil. Los adultos y los niños trabajan por separado y al final se juntan para orar en familia.", "enfoque": "1. Recibimos a la gente con un saludo a cada familia. Les decimos que van a hacer algo juntos que se pueden llevar a la casa. Los niños se van a su espacio cantando y los adultos se sientan en círculo.\n2. En grupitos de adultos hablamos de lo que está afectando a la familia y de qué podemos hacer para estar más unidos. Todo hablado.\n3. Los del equipo, oramos por las familias al final\nLo define Mateo", "como": "1. Desarrollo de la enseñanza\nSe dividirán las familias en cuatro grupos. Cada grupo contará con el acompañamiento de dos integrantes del equipo, quienes facilitarán las conversaciones y reflexiones relacionadas con la temática.\nLa enseñanza estará dirigida por Laura Hincapié y Daniel Moreno. Durante la charla se irán planteando diferentes preguntas que permitan a las familias reflexionar y compartir sus experiencias en pequeños grupos.\n\n2. Actividad:\nAl finalizar la enseñanza, cada grupo realizará una actividad simbólica: construir un cordón utilizando tres hilos de lana:\n\n- Blanco: representa a Dios, quien es el centro y fundamento de la familia.\n- Rojo y azul: representan a la familia y los lazos que unen a sus integrantes.\n\nMientras realizan el cordón, el integrante del equipo que acompaña al grupo orientará una conversación a partir de las siguientes preguntas:\n1. ¿Qué está dañando actualmente a mi familia?\n2. ¿Qué puedo hacer esta semana para que estemos más unidos?\n\n3. Oración y cierre\n\n\n", "mm": [{"a": "16:00", "b": "16:05", "q": "Organizamos las sillas, y oramos como equipo para dar inicio.", "p": "Todo el equipo"}, {"a": "16:05", "b": "16:10", "q": "Recibimos a las familias con música, las saludamos y separamos a los niños de los adultos.", "p": "Todo el equipo"}, {"a": "16:10", "b": "16:15", "q": "Adultos: mostramos un hilo delgado que se rompe fácil y luego una cuerda de tres hilos que no se rompe. Les preguntamos por qué pasa eso.", "p": "Daniel Moreno"}, {"a": "16:15", "b": "16:35", "q": "Adultos: leemos Eclesiastés 4:9-12 y hablamos de que Dios es el tercer hilo. También del perdón, de hablar en familia y de orar juntos en casa.", "p": "Laura Hincapie"}, {"a": "16:35", "b": "16:40", "q": "Adultos: hacen un cordón con tres hilos de lana (blanco es Dios, rojo y azul es la familia) mientras hablan en grupitos: ¿qué está dañando a mi familia? ¿qué puedo hacer esta semana para que estemos más unidos?", "p": "Todo el equipo"}, {"a": "16:40", "b": "16:45", "q": "Oramos por cada familia tomados de las manos y hacemos una oración final por todos.", "p": "Todo el equipo"}], "pe": [{"p": "Laura Hincapie", "r": "Desarrollo de la enseñanza"}, {"p": "Daniel Moreno", "r": "Desarrollo de la enseñanza"}, {"p": "Natalia Casallas", "r": "Acompaña grupo 1"}, {"p": "Manuela Cárdenas", "r": "Acompaña grupo 1"}, {"p": "Isabella Beltrán", "r": "Acompaña grupo 2"}, {"p": "Diego Durán", "r": "Acompaña grupo 2"}, {"p": "Juan Sebastián Bonilla", "r": "Acompaña grupo 3"}, {"p": "Alejandra Hernández", "r": "Acompaña grupo 3"}, {"p": "Samuel Carrillo", "r": "Acompaña grupo 4"}], "jg": [], "ma": [{"i": "Lana blanca, roja y azul", "t": "100 g", "c": 3, "s": "Bogotá", "re": true}, {"i": "Tijeras", "t": "punta roma", "c": 4, "s": "Quibdó", "re": false}], "lluvia": "Todo se puede hacer aún si llueve", "nec": "50 sillas para sentar a las personas"}, {"id": "b8-nin", "b": "b8", "rol": "ninos", "tit": "\"Dios cuida mi corazón y mis emociones\" (niños)", "eq": [3, 5], "line": "Juegos, enseñanza bíblica y actividad creativa sobre las emociones.", "ven": [["16:00", "16:45"]], "notas": ["El equipo 5 puede aportar una idea de una segunda actividad complementaria para el mismo espacio, si lo consideran.", "Un solo grupo de niños."], "estado": "enviada", "act": "17/11/2026 22:47:19", "editor": "Anngie Moreno", "que": "\"Dios cuida mi corazón y mis emociones\". A través de juegos, una enseñanza bíblica y una actividad creativa, los niños aprenderán que pueden expresar sus emociones a Dios, que Él los escucha y que nunca están solos cuando sienten tristeza, miedo, enojo o preocupación", "enfoque": "Principio bíblico: Dios se interesa por lo que sentimos y podemos confiar en Él siempre (Juan 11:28-37; Salmo 34:18; Filipenses 4:6-7). Los niños aprenderán que todas sus emociones son válidas y que Dios no se aleja cuando sienten tristeza, miedo o enojo. Con ejemplos cotidianos, verán que orar, hablar con personas de confianza y pedir ayuda son formas sanas de enfrentar las dificultades.\nDios cuida mi corazón y mis emociones", "como": "Primera actividad: Desafío al aire. Hay 2 grupos, hombres contra mujeres. Se hacen en círculo cerrado cogidos de la mano. La idea es que se suelte una bomba en el centro del círculo y todo el equipo debe llevar el globo hasta el otro extremo usando solo la cabeza. El que llegue primero gana (Min 12:50 en adelante de link del video)\nSegunda actividad: Transporte en globo. Hay dos equipos que competirán por quien lleva los vasos al otro extremo. La idea es que las bases de los dos vasos que se van a utilizar estén pegadas, que queden la parte de la avertura libre. Cada participante debe tener una bomba. Apenas se dé la indicación deben inflar su bomba para agarrar el baso con la presión de la bomba inflada y pasarla a su compañero que estará detrás de él, el de atrás hará lo mismo sucesivamente hasta llegar al final. Gana el que llegue primero. (Min 6:25 en adelante)\nTercera actividad: Busco pañoleta. Habrán 2 grupos cogidos de las manos en círculos cerrados. Uno de los integrantes de cada equipo tendra una pañoleta, ya sea en el bolsillo o en la tira del pantalón (sin amarrar). Habrá un integrante de cada aquipo que tiene el objetivo de quitarle la pañoleta a su equipo contrincante. Todo el equipo que está en círculo deberá impedir que le quiten la pañoleta. (Min 11:05) \nCuarta actividad: Zig Zag ping pong. Dos grupos ubicados en zig zag. Cada uno va a tener un vaso. La idea es que haya un recipiente lleno de ping pongs. El primer integrante de cada grupo cogerá un ping pong y lo meterá en su vaso y deberá lanzarlo a su compañero que está en diagonal sin que se caiga hasta llegar al otro extremo, en donde habrá un recipiente para cada equipo. Después del tiempo que se dé, gana el que mayor cantidad de ping pongs haya depositado en el recipiente. (Min 13:36)\nhttps://www.youtube.com/watch?v=hPpKG1LJ8vE ", "mm": [{"a": "16:00", "b": "16:10", "q": "Rompehielo", "p": "Anngie Moreno"}, {"a": "16:10", "b": "16:25", "q": "Enseñanza bíblica", "p": "Emanuel Rodríguez"}, {"a": "16:25", "b": "16:45", "q": "Actividad de dibujo", "p": ""}], "pe": [{"p": "Allisson Domínguez", "r": "Pasar los materiales de la actividad y estar pendiente de los útiles que se necesiten para la actividad e dibujo"}, {"p": "Anngie Moreno", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Emanuel Rodríguez", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Samuel Isaacs", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Nataly Ruiz", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "David Castaño", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Sarah Forero", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Juan José Lugo", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Lizeth Varón", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}, {"p": "Silvana Caballero", "r": "En la actividad de dibujo tendrá uno de los grupos de niños"}], "jg": [], "ma": [{"i": "Hojas blancas", "t": "Carta", "c": 60, "s": "Quibdó", "re": false}, {"i": "Lápices", "t": "Negros", "c": 60, "s": "Bogotá", "re": true}, {"i": "Cajas de Colores", "t": "x12", "c": 5, "s": "Bogotá", "re": true}, {"i": "Paquete Bombas", "t": "grandes ", "c": 1, "s": "Bogotá", "re": false}, {"i": "Paquete vasos ", "t": "x25", "c": 1, "s": "Quibdó", "re": false}], "lluvia": "Buscar un lugar con techo y divididos un miembro del equipo con el grupo de niños. Se ubican para poder igual realizar la actividad mientras se les comparte la enseñanza en grupos, y ya no en general, con esta planteado, si tenemos buen clima", "nec": "Microfono y sonido "}, {"id": "b9-con", "b": "b9", "rol": "conexion", "tit": "Jornada comunitaria", "eq": [2, 4], "line": "Juegos de integración, conversación y oración.", "ven": [["8:45", "11:45"]], "notas": ["Pongan en común sus juegos y elijan un máximo de 5.", "Definan entre los líderes una temática clara para compartir en el cierre y quién la va a compartir, y comuníquenla a Matt L.", "Solo adultos.", "El equipo 4 participa completo en conexión."], "estado": "enviada", "act": "17/11/2026 16:54:53", "editor": "Daniel Moreno", "que": "Realizar una jornada comunitaria jóvenes y adultos mediante juegos tradicionales, dinámicas cooperativas y actividades participativas que permitan compartir el amor de Jesús. Buscamos acercarnos a las familias, conocer sus necesidades, escucharlas y transmitirles que Dios las conoce, las ama y es fuente de esperanza.", "enfoque": "Transmitir que Dios conoce nuestra historia, nuestras emociones y necesidades, y que nunca estamos solos en las dificultades. A través de las actividades buscamos fortalecer la unión, la solidaridad y el apoyo comunitario, recordando que en Jesús encontramos amor, consuelo y esperanza.\n\nPrincipios bíblicos:\n- Dios está cerca: Salmo 34:18.\n- Dios conoce nuestro corazón: Salmo 139:1-3.\n- En Jesús encontramos esperanza: Romanos 15:13.\n- Debemos llevar las cargas unos de otros: Gálatas 6:2.", "como": "Invitaremos a niños y adultos a participar en juegos, retos grupales y actividades creativas como el mural de la esperanza. \nMientras compartimos las actividades, nos acercaremos a las familias para conocerlas, preguntarles cómo están, escuchar sus experiencias y conocer sus necesidades.\nOfreceremos oración personal para quienes lo deseen, escuchando sus peticiones y orando por sus familias.\n\n\n\nAtraemos: juegos tradicionales, retos grupales y actividades recreativas.\n\nConversamos: escuchamos a las familias y compartimos mensajes de esperanza relacionados con sus experiencias.\n\nOramos: ofrecemos oración voluntaria por las necesidades personales y familiares, compartiendo el mensaje de salvación en Jesús.", "mm": [{"a": "08:45", "b": "09:00", "q": "Bienvenida, invitación a los transeúntes y apertura de las cinco estaciones.", "p": "Todo el equipo"}, {"a": "09:00", "b": "10:20", "q": "Primera jornada de feria: juegos, retos, premios y mural comunitario.", "p": "Todo el equipo"}, {"a": "10:20", "b": "10:40", "q": "Descanso, refrigerio e interacción informal con los participantes.", "p": "Todo el equipo"}, {"a": "10:40", "b": "11:00", "q": "Segunda jornada de feria: reapertura de estaciones y nuevas invitaciones.\nEn fasis en actividad del Mural.", "p": "Todo el equipo"}, {"a": "11:00", "b": "11:30", "q": "Enseñanza bíblica: Dios está cerca de nosotros.", "p": "Daniel Moreno"}, {"a": "11:30", "b": "11:40", "q": "Tiempo de oración y ministración, todo el equipo debe estar pendiente.", "p": "Daniel Moreno"}, {"a": "11:40", "b": "11:45", "q": "Agradecimientos, invitación a conocer más de Jesús y despedida.", "p": "Camila Berruecos"}], "pe": [{"p": "Daniel Moreno", "r": "Coordinación general de la jornada junto a Camila, supervisión de las estaciones, apoyo en las conversaciones y participación en el mensaje bíblico."}, {"p": "Camila Berruecos", "r": " Coordinación general de la jornada junto a Daniel, organización de los participantes y responsable de la estación 5 junto a Daniel."}, {"p": "Isabella Beltrán", "r": "Apoyo en la estación 1. - Salir en pareja con Lizeth a conectar con las personas en los tiempos libres"}, {"p": "Yeison Hernández", "r": "Responsable de la estación 1, junto a Isabella. -  Salir en pareja con Samuel a conectar con las personas en los tiempos libres"}, {"p": "Gabriela Arteaga", "r": "Responsable de la estación 2, junto a Samuel. - Salir en pareja con Alejandra a conectar con las personas en los tiempos libres."}, {"p": "Samuel Carrillo", "r": "Apoyo en la estación 2 - Salir en pareja con Yeison a conectar con las personas en los tiempos libres."}, {"p": "Alejandra Hernández", "r": "Responsable de la estación 3, junto a María Alejandra. - Salir en pareja con Gabriela a conectar con las personas en los tiempos libres."}, {"p": "María Alejandra Aguilar", "r": "Apoyo en la estación 3 - Salir en pareja con Natalia a conectar con las personas en los tiempos libres."}, {"p": "Natalia Casallas", "r": "Responsable de la estación 4, junto a Lizeth - Salir en pareja con María Alejandra a conectar con las personas en los tiempos libres."}, {"p": "Lizeth Pérez", "r": "Apoyo en la estación 4. - Salir en pareja con Isabella a conectar con las personas en los tiempos libres."}], "jg": [{"n": "ESTACIÓN 1. LANZAMIENTO DE AROS", "d": "Se colocarán cinco botellas a diferentes distancias. Cada participante tendrá tres oportunidades para lanzar aros e introducirlos en las botellas. Quien consiga acertar al menos tres lanzamientos superará el reto.", "p": "Yeison Hernández"}, {"n": "ESTACIÓN 2. TORRE CONTRARRELOJ", "d": "Cada participante tendrá 30 segundos para recoger y construir una pirámide con 10 vasos plásticos y volver a apilarlos sin que se caigan mientras mantiene una bomba en el aire sin dejarla caer. Si completa el reto dentro del tiempo, gana.", "p": "Samuel Carrillo"}, {"n": "ESTACIÓN 3. BOLOS DE ESPERANZA", "d": "Se ubicarán 1o botellas plasticas en forma de diamante. Cada participante tendrá tres oportunidades para lanzar pelotas pequeñas e intentar tumbar las botellas. Quien consiga tumbar al menos 6 botellas superará el reto.", "p": "María Alejandra Aguilar"}, {"n": "ESTACIÓN 4. CHARADAS", "d": "Cada participante sacará una tarjeta con una palabra o situación que deberá representar mediante mímica, sin hablar. Los demás intentarán adivinarla en un máximo de 30 segundos. Las tarjetas tendrán palabras cotidianas, emociones, profesiones y situaciones divertidas.", "p": "Natalia Casallas"}, {"n": "ESTACIÓN 5. MURAL DE LA ESPERANZA", "d": "Se instalará un mural donde cada persona podrá escribir o dibujar una respuesta a la pregunta: \"¿Qué te da esperanza en los momentos difíciles?\".\n\nLos responsables de la estación aprovecharán la participación para conversar con las personas, escuchar sus respuestas y compartir una reflexión sobre la esperanza en Dios y orar por la gente si lo permiten.", "p": "Daniel Moreno"}], "ma": [{"i": "Pelotas de letras golty N5", "t": "CIRCUFERENCIA : 10 cm", "c": 3, "s": "Bogotá", "re": false}, {"i": "Botellas plásticas vacías", "t": "Plastico - botellas de un litro", "c": 15, "s": "Prestado", "re": false}, {"i": "Vasos plásticos x 50 und", "t": "12 oz", "c": 1, "s": "Bogotá", "re": false}, {"i": "Aros plásticos", "t": "15 cm de diametro", "c": 5, "s": "Bogotá", "re": false}, {"i": "Pelotas de tenis usadas", "t": "Pelota de tenis, se consiguen en la casa del tenista, frente a la estación de suba calle 100", "c": 5, "s": "Bogotá", "re": false}, {"i": "Paquete de dulces x 100 und", "t": "Paquete x 100 und", "c": 2, "s": "Bogotá", "re": false}, {"i": "bombas/globos (ya han pedido varios paquetes otro grupos)", "t": "estandar", "c": 5, "s": "Ya lo tenemos", "re": false}, {"i": "Papel Kraf", "t": "pliegos", "c": 4, "s": "Bogotá", "re": false}, {"i": "Marcados de colores", "t": "Estándar ", "c": 6, "s": "Bogotá", "re": false}, {"i": "Cinta pegante", "t": "Gruesa", "c": 1, "s": "Bogotá", "re": false}, {"i": "Tarjetas charadas impresas", "t": "8 tarjetas en una hoja carta", "c": 6, "s": "Bogotá", "re": false}], "lluvia": "Las cinco estaciones se ubicarán dentro de un espacio cubierto de ser posible.\n\nSe mantendrá la modalidad de participación libre, sin necesidad de formar grupos.\n\nLos juegos de lanzamiento se adaptarán a las distancias y dimensiones del lugar.\n\nEl mural se instalará en una pared o superficie protegida.\n\nSe mantendrán los mismos horarios y la enseñanza bíblica.", "nec": "Confirmar un espacio cubierto como alternativa en caso de lluvia."}, {"id": "b9-nin", "b": "b9", "rol": "ninos", "tit": "Búsqueda del tesoro", "eq": [1, 5], "line": "\"Jesús es el tesoro\" (Mateo 13:44): estaciones, rompecabezas y cofre.", "ven": [["8:45", "11:45"]], "notas": ["El equipo 1 realiza la búsqueda del tesoro con la base del modelo de Anngie (viene precargado). Para más dudas, consultar a Anngie.", "El equipo 5 apoya esta actividad.", "Definir quién hace el cierre de la enseñanza."], "estado": "modificada", "act": "17/11/2026 19:41:47", "editor": "Laura Hincapie", "que": "Búsqueda del tesoro por estaciones: 4 grupos de colores superan retos y cada uno gana una pieza del mapa. Solo al juntar las 4 piezas leen la frase Jesús es el tesoro y siguen el camino hasta el cofre. Luego viene la enseñanza y colorean un cofre para llevar a casa.", "enfoque": "Jesús es el tesoro más valioso (Mateo 13:44). El hombre del campo dejó todo porque nada valía tanto como lo que encontró. Las cosas se pueden dañar o perder, pero a Jesús nadie nos lo puede quitar (Mateo 6:19-20), y con Él tenemos un futuro y una esperanza (Jeremías 29:11). Lo aterrizamos con el cofre: cada niño dibuja a Jesús como su tesoro y ora.", "como": "08:45–09:15 Dramatización del hombre que encuentra el tesoro en el campo (Diego Duran y Sarah) \n- El resto del equipo se encarga de mantener juntos a los niños y atentos a la dramatización. \n09:15–10:05 Búsqueda del tesoro: 4 grupos rotan por 4 estaciones y reciben una marca en su tarjeta por cada reto superado \n-Laura Hincapié: Coordina los tiempos y las rotaciones, recibe a los niños que llegan tarde. \n- EST 1: José Lugo - Dirige la estación 1, de puntería (lanzar 5 pin pones hasta encestarlos en los vasos), Entrega las piezas del rompecabezas. \n-EST 2: David Castaño - Realizar mímicas de animales, para que los niños las adivinen. Entrega las piezas del rompecabezas.\n-EST. 3: Silvana - reto en equipo de pasar el aro sin soltarse de las manos. Entrega las piezas del rompecabezas\n-EST 4: Juan Bonilla - buscar monedas de oro escondidas. Entrega las piezas del rompecabezas\n*El resto del equipo se encarga de apoyar a los niños en las actividades \n\n10:05–10:20 Cada grupo recibe su pieza del rompecabezas. Juntan las 4, descubren “Jesús es el tesoro” y celebran con dulces (Laura Hincapié)\n10:20–10:35 Descanso e hidratación\n10:35–11:00 Enseñanza y oración (Laura Hincapié)\n11:00–11:35 Colorear el cofre “Jesús es mi tesoro”\n11:35–11:50 Canción de cierre, oración y despedida\n11:50–12:00 Recoger", "mm": [{"a": "08:45", "b": "09:15", "q": "Dramatización del hombre que encuentra el tesoro en el campo", "p": "Diego Durán"}, {"a": "09:15", "b": "10:05", "q": "Búsqueda del tesoro: 4 grupos rotan por 4 estaciones y reciben una marca en su tarjeta por cada reto superado", "p": "Todo el equipo"}, {"a": "10:05", "b": "10:20", "q": "Cada grupo recibe su pieza del rompecabezas. Juntan las 4, descubren “Jesús es el tesoro” y celebran con dulces", "p": "Laura Hincapie"}, {"a": "10:20", "b": "10:35", "q": "Descanso e hidratación", "p": "Todo el equipo"}, {"a": "10:35", "b": "11:00", "q": "Enseñanza", "p": "Laura Hincapie"}, {"a": "11:00", "b": "11:35", "q": "Colorear el cofre “Jesús es mi tesoro”", "p": "Silvana Caballero"}, {"a": "11:35", "b": "11:45", "q": "Canción de cierre, oración y despedida", "p": "Lizeth Varón"}], "pe": [{"p": "Laura Hincapie", "r": "Coordina los tiempos y las rotaciones, recibe a los niños que llegan tarde, entrega las piezas del rompecabezas, guía el momento de descubrir la frase y da la enseñanza"}, {"p": "Juan José Lugo", "r": "Dirige la estación 1, de puntería (lanzar pelotas a los vasos). Marca las tarjetas de los grupos"}, {"p": "David Castaño", "r": "Dirige la estación 2: enseñar Mateo 13:44 con gestos. Marca las tarjetas de los grupos"}, {"p": "Juan Sebastián Bonilla", "r": "Dirige la estación 4: buscar monedas de oro escondidas. Marca las tarjetas de los grupos"}, {"p": "Silvana Caballero", "r": "dirige la estación 3: reto en equipo de pasar el aro sin soltarse de las manos. Marca las tarjetas de los grupos"}, {"p": "Diego Durán", "r": "Dramatización "}, {"p": "Sarah Forero", "r": "Dramatización "}], "jg": [], "ma": [{"i": "Tijeras", "t": "normales", "c": 3, "s": "Bogotá", "re": true}, {"i": "Paquetes de Stickers de colores (100 stickers)", "t": "Círculos, 4 colores", "c": 2, "s": "Bogotá", "re": false}, {"i": "Carton paja", "t": "medio pliego", "c": 1, "s": "Quibdó", "re": false}, {"i": "Fichas bibliográficas de colores", "t": "normales multicolor", "c": 20, "s": "Bogotá", "re": false}, {"i": "Paquete marcadores gruesos y permanentes", "t": "x 6 multicolor", "c": 1, "s": "Bogotá", "re": true}, {"i": "Vasos rojo y azul con pin pon (Dollarcity)", "t": "NA", "c": 1, "s": "Bogotá", "re": true}, {"i": "Hula hula", "t": "normales", "c": 4, "s": "Quibdó", "re": false}, {"i": "Cartulina dorada", "t": "pliegos", "c": 2, "s": "Bogotá", "re": false}, {"i": "Hoja con impresión cofre", "t": "a blanco y negro (una impresa, el resto fotocopia) ", "c": 50, "s": "Bogotá", "re": false}, {"i": "Caja colores", "t": "x12", "c": 4, "s": "Bogotá", "re": true}, {"i": "Cofre", "t": "Articulo propio", "c": 1, "s": "", "re": false}], "lluvia": "Si la lluvia es leve continuamos con la actividad, si es fuerte nos resguardamos y hablamos sobre el tesoro, coloreamos el tesoro y hablamos sobre mateo 13:44", "nec": ""}, {"id": "b10-nin", "b": "b10", "rol": "ninos", "tit": "Juegos rápidos", "eq": [2, 5], "line": "Juegos cortos para un espacio pequeño con gente pasando.", "ven": [["16:30", "17:00"]], "notas": ["Los juegos deben ser realizables en un espacio pequeño como el Malecón, donde hay gente pasando constantemente (por ejemplo: lanzamiento de sacos, pasar una pelota, una carrera corta).", "Tener una palabrita o algo para entregarles, o pensar cómo hacer un cierre rápido con ellos en caso de que no se vayan a quedar a lo que sigue. Se pueden cerrar los juegos con una palabra corta.", "Pongan en común y tengan entre los dos equipos un máximo de 4 juegos, con sus responsables."], "estado": "enviada", "act": "17/11/2026 16:52:57", "editor": "David Castaño", "que": "Amor manifiesto\nEs una activación evangelística mediante cuatro juegos cortos y participativos dirigidos a niños y familias que transitan por el Malecón de Quibdó. A través de retos sencillos de coordinación, puntería y trabajo en equipo, buscamos generar espacios de integración y acercamiento con la comunidad, enseñando que necesitamos apoyarnos, ayudarnos y acompañarnos mutuamente.\n\nCada juego tendrá una enseñanza breve relacionada con el amor al prójimo y la importancia de ayudar a los demás. Al finalizar, se compartirá un mensaje bíblico y se entregará una pequeña tarjeta con el mensaje: «¡No caminas solo! Jesús te ama y quiere caminar contigo».", "enfoque": "", "como": "La actividad se desarrollará en un espacio pequeño, visible y seguro del Malecón de Quibdó, procurando no obstaculizar el paso de peatones ni las actividades habituales del lugar.\n\nSe organizarán cuatro estaciones independientes, distribuidas alrededor de una zona delimitada. Cada estación contará con dos miembros del equipo encargados de invitar a participar, explicar las instrucciones, acompañar el juego y compartir una enseñanza corta. Dos miembros del equipo adicionales apoyarán la invitación a las familias, la logística y el cierre.", "mm": [{"a": "16:30", "b": "16:35", "q": "Bienvenida e invitación: Los voluntarios se acercarán a los niños y sus familias con una actitud amable, invitándolos a participar en retos cortos y divertidos. Se explicará que son actividades gratuitas de integración y trabajo en equipo.", "p": "David Castaño"}, {"a": "16:35", "b": "16:45", "q": "Estación 1: Un corazón bajo presión: ¿qué estás guardando en tu corazón?  Dinámica con un globo, palos de pincho y una caja para representar cómo las decisiones, las heridas emocionales y las cargas que acumulamos pueden aumentar nuestra presión interior hasta hacernos sentir que ya no podemos más.  Principio bíblico y enseñanza: Enseñar que no debemos enfrentar solos nuestras heridas y cargas, sino acudir a Jesús, quien nos ofrece amor, consuelo, perdón y sanidad. Salmos 147:3 nos recuerda que Dios sana a los quebrantados de corazón y venda sus heridas", "p": "Sarah Forero"}, {"a": "16:45", "b": "16:50", "q": "Estación 2 El amor no busca lo suyo: El amor no consiste solamente en decir que queremos a alguien. También se demuestra cuando acompañamos, ayudamos y estamos pendientes de los demás:\nCada equipo se organiza en una fila detrás de un cono.\nEl servidor entrega una pelota al primer participante.\nEl niño debe pasarla por encima de su cabeza al compañero que está detrás.\nEl siguiente debe pasarla por debajo de sus piernas.\nEl tercero vuelve a pasarla por encima de la cabeza.\nContinúan alternando hasta que la pelota llegue al último participante.\nEl último corre caminando rápidamente (sin correr) hasta el frente de la fila y comienza nuevamente la secuencia.\nEl reto termina cuando todos hayan tenido la oportunidad de estar al frente y la pelota llegue a la posición inicial.", "p": "Camila Berruecos"}, {"a": "16:50", "b": "16:55", "q": "Estación 3: La fidelidad del amor: A que voz estas escuchando ? Una persona con los ojos vendados deberá reunir vasos del mismo color siguiendo las instrucciones de un guía que representa al Espíritu Santo, mientras los demás intentan distraerla, simbolizando las voces del mundo que buscan alejarnos del camino de Dios", "p": "Lizeth Varón"}, {"a": "16:30", "b": "17:00", "q": "Generosidad: La generosidad significa compartir lo que tenemos. Cuando pensamos también en los demás, podemos conseguir grandes cosas juntos:\nCada equipo forma una fila.\nEl primer participante recibe una canasta con 15 pelotas o el número de pelotas que se pueda.\nDeben pasar las pelotas de mano en mano hasta llegar al último integrante.\nEl último participante debe depositarlas en la canasta vacía.\nTienen 60 segundos para trasladar la mayor cantidad posible.\nSi una pelota cae, deben recogerla y continuar", "p": "Lizeth Pérez"}], "pe": [{"p": "David Castaño", "r": "Atrae personas a los juegos, dirige la actividad"}, {"p": "Sarah Forero", "r": "Dirige estación 1: Un corazón bajo presión"}, {"p": "Gabriela Arteaga", "r": "Apoya Estación 1: Un corazón bajo presión"}, {"p": "Camila Berruecos", "r": "Dirige Estación 2: El amor no busca lo suyo"}, {"p": "Silvana Caballero", "r": "Dirige Estación 2: El amor no busca lo suyo"}, {"p": "Lizeth Varón", "r": "Dirige estación 3: La fidelidad del amor "}, {"p": "Yeison Hernández", "r": "Apoya estación 3: La fidelidad del amor"}, {"p": "Lizeth Pérez", "r": "Dirige estación 4: El amor es generoso"}, {"p": "Juan José Lugo", "r": "Apoya estación 4: El amor es generoso"}], "jg": [{"n": "Un corazón bajo presión ", "d": "Estación 1: Un corazón bajo presión: ¿qué estás guardando en tu corazón?  Dinámica con un globo, palos de pincho y una caja para representar cómo las decisiones, las heridas emocionales y las cargas que acumulamos pueden aumentar nuestra presión interior hasta hacernos sentir que ya no podemos más.  Principio bíblico y enseñanza: Enseñar que no debemos enfrentar solos nuestras heridas y cargas, sino acudir a Jesús, quien nos ofrece amor, consuelo, perdón y sanidad. Salmos 147:3 ciones del juego:\n1. La persona con mayor puntaje gana un premio sorpresa (al final todos pueden ganar el mismo premio, esto como mensaje de Jesús y su gracia)\n2. Antes de empezar a jugar habrá una caja pequeña que dirá \"Deja aquí lo que no te permite avanzar\", se le indica a la persona que puede dejar en una frase anónima, o pensar en un momento que cosas no le han permitido avanzar\n3. El juego se lleva a cabo \n4. Se entrega el premio y se conversa con la persona reflexionando sobre lo que no nos deja avanzar y como Cristo es esa esperanza para seguir en el camino. Dejo la referencia de la imagen, se podrían poner más vasos para hacerlo más dificil y aumentar su dificultad si alguien lo mueve", "mm": [{"a": "16:30", "b": "17:00", "q": "Juego, conversación y oración con personas", "p": "Todo el equipo"}, {"a": "18:00", "b": "18:20", "q": "Conversaciones y cierres", "p": "Todo el equipo"}], "pe": [{"p": "Anngie Moreno", "r": "En la actividad invita a las personas, da indicaciones y alienta a jugar."}, {"p": "Allisson Domínguez", "r": "En la actividad invita a las personas, da indicaciones y alienta a jugar."}, {"p": "Emanuel Rodríguez", "r": "En la actividad invita a las personas, da indicaciones y alienta a jugar."}, {"p": "Samuel Isaacs", "r": "En la actividad invita a las personas, da indicaciones y alienta a jugar."}, {"p": "Nataly Ruiz", "r": "Dirige la actividad.  En la actividad invita a las personas, da indicaciones y alienta a jugar."}], "jg": [], "ma": [{"i": "Papel kraft", "t": "pliegos", "c": 2, "s": "Quibdó", "re": false}, {"i": "Rollo de cinta", "t": "Gruesa transparente", "c": 1, "s": "Bogotá", "re": true}, {"i": "Pimpones", "t": "normales", "c": 10, "s": "Bogotá", "re": true}, {"i": "Caja de temperas  multicolor", "t": "Pequeñas", "c": 1, "s": "Bogotá", "re": true}, {"i": "Sharpie", "t": "delgado", "c": 2, "s": "Bogotá", "re": true}, {"i": "Esfero", "t": "negro", "c": 1, "s": "Bogotá", "re": false}, {"i": "Bolsa de dulces x 100", "t": "surtidos /* ================= finance engine ================= */
const pocketOf = met => met === 'efectivo' ? 'efe' : 'cta';
function effects(m){
  const a = m.amt||0, p = pocketOf(m.met);
  switch(m.type){
    case 'ingreso': return [[m.to,p,a]];
    case 'gasto': return [[m.from,p,-a]];
    case 'transfer': return (m.met==='efectivo'?[[m.from,'efe',-a],[m.to,'efe',a]]:[[m.from,'cta',-a],[m.to,'cta',a]]).filter(x=>x[0]&&x[0]!=='otros');
    case 'entrega': case 'devol': return [[m.from,'efe',-a],[m.to,'efe',a]].filter(x=>x[0]&&x[0]!=='otros');
    case 'retiro': return [[m.from,'cta',-a],[m.from,'efe',a]];
    case 'consig': return [[m.from,'efe',-a],[m.from,'cta',a]];
    case 'ajuste': return [[m.from,m.pocket||'efe',a]];
  } return [];
}
function partLedger(){ const L={}; const add=(h,p,v,k)=>{ if(!h||!p||!HOL[h]) return; L[h]=L[h]||{}; const x=L[h][p]=L[h][p]||{in:0,out:0,gas:0}; x[k]+=v; };
  for(const m of S.movs){ const a=m.amt||0;
    if(m.type==='ingreso'){ if(m.alloc) for(const k in m.alloc) add(m.to,k,m.alloc[k],'in'); else add(m.to,m.part,a,'in'); }
    else if(m.type==='gasto') add(m.from,m.part,a,'gas');
    else if(m.type==='ajuste'&&m.part) add(m.from,m.part,-a,'gas');
    else if(m.type==='transfer'||m.type==='entrega'||m.type==='devol'){ add(m.from,m.pFrom,a,'out'); add(m.to,m.pTo,a,'in'); } }
  return L; }
function partRows(id){ const L=partLedger()[id]||{}; return Object.keys(L).sort((a,b)=>D.PART.findIndex(p=>p.id===a)-D.PART.findIndex(p=>p.id===b)).map(k=>{ const x=L[k]; return {k,asig:x.in-x.out,gas:x.gas,queda:x.in-x.out-x.gas}; }); }
function partQueda(id,k){ const r=partRows(id).find(x=>x.k===k); return r?r.queda:0; }
function noFactura(){ return S.movs.filter(m=>(m.type==='gasto'&&!(m.recibos||[]).length)||((m.type==='entrega'||m.type==='transfer')&&m.to==='otros'&&!(m.recibos||[]).length)); }
function balances(upTo){
  const B = Object.fromEntries(D.HOLDERS.map(h=>[h.id,{cta:0,efe:0}]));
  for (const m of S.movs){ if (upTo && m.ts > upTo) continue; for (const [h,p,d] of effects(m)) if (B[h]) B[h][p]+=d; }
  return B;
}
function totals(){
  let rec=0, gas=0, today=0; const n=now();
  for (const m of S.movs){ if(m.type==='ingreso') rec+=m.amt; if(m.type==='gasto'){ gas+=m.amt; if(m.ts.slice(0,10)===n.date) today+=m.amt; } }
  const B=balances(); let all=0; for(const h in B) all+=B[h].cta+B[h].efe;
  return {rec,gas,today,all,B};
}
function spentBy(){
  const P={}, BL={};
  for (const m of S.movs){ if(m.type!=='gasto') continue; P[m.part]=(P[m.part]||0)+m.amt; if(m.part==='ac_mat') BL[m.blk||'—']=(BL[m.blk||'—']||0)+m.amt; }
  return {P,BL};
}
function series(holderFilter){
  // running total balance over time (for sparkline)
  const ms=[...S.movs].sort((a,b)=>a.ts<b.ts?-1:1); let v=0; const pts=[0];
  for(const m of ms){ for(const [h,p,d] of effects(m)) if(!holderFilter||holderFilter(h,p)) v+=d; pts.push(v); }
  return pts;
}
function sparkSVG(pts, color='#9BE15D', id='g'+uid()){
  if (pts.length<2) pts=[0,0];
  const w=400,h=110,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const xy=pts.map((v,i)=>[i/(pts.length-1)*w, h-8-((v-mn)/rg)*(h-26)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#0B0B0E" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function compressFile(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)){ if(file.size>5e6) return rej('El PDF pesa más de 5 MB'); const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); return; }
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const mx=1400, k=Math.min(1,mx/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.72)); };
    img.onerror=()=>rej('No se pudo leer la imagen'); img.src=url; });
}
async function addRecibos(files){

}

const SOUND_RX = /parlante|sonido|micr[oó]fono|bafle|meg[aá]fono|m[uú]sica|canciones/i;
function soundSlots(){
  const out=[];
  for (const d in D.SCHED) for (const e of D.SCHED[d]){
    if(!e.b||!e.r) continue;
    if(/teatro|danza|palabra|testimonio|taller/i.test(e.x)) out.push({k:'s-'+d+'-'+e.r[0]+'-'+e.b, day:d, b:e.b, r:e.r, x:e.x.replace(/^Grupo [AB][^:]*: /,''), why:'Programa en tarima'});
  }
  for (const f of D.FICHAS){
    const txt=[f.nec,f.como,(f.mm||[]).map(x=>x.q).join(' ')].join(' ');
    if(!SOUND_RX.test(txt)) continue;
    const b=BLK[f.b]; const w=(f.ven&&f.ven[0])||null; if(!w) continue;
    const m=txt.match(SOUND_RX);
    out.push({k:'f-'+f.id, day:b.day, b:f.b, r:[t24(w[0]),t24(w[1])], x:f.tit, why:'La ficha pide '+m[0].toLowerCase(), f:f.id});
  }
  out.sort((a,b)=> D.DAYS.findIndex(x=>x.id===a.day)-D.DAYS.findIndex(x=>x.id===b.day) || a.r[0]-b.r[0]);
  for (const s of out){ s.conf = out.filter(o=>o!==s&&o.day===s.day&&o.b!==s.b&&BLK[o.b].place!==BLK[s.b].place&&o.r[0]<s.r[1]&&s.r[0]<o.r[1]).map(o=>o.b); }
  return out;
}

/* ================= helpers: schedule ================= */
function dayOfDate(date){ return D.DAYS.find(d=>d.date===date); }
function nowItems(n){ const d=dayOfDate(n.date); if(!d) return []; return (D.SCHED[d.id]||[]).filter(e=>e.r&&e.r[0]<=n.min&&n.min<e.r[1]); }
function nextUp(n){
  for (const d of D.DAYS){ if(d.date<n.date) continue; for(const e of D.SCHED[d.id]||[]){ if(!e.r) continue; if(d.date>n.date||e.r[0]>n.min) return {d,e}; } }

}

function saveQ(){ if(!QF.n.trim()){ $('#qErr').textContent='Escribe el nombre'; return; }

function delQ(id,btn){ if(btn.dataset.c!=='1'){ btn.dataset.c='1'; btn.textContent='Toca de nuevo para eliminar'; btn.style.color='var(--neg)'; return; } S.qlist=S.qlist.filter(q=>q.id!==id); save(); closeSheet(); render(); }
function toggleQ(id){
  const q=S.qlist.find(x=>x.id===id); if(!q) return;
  if(q.st==='ok'){
    if(q.movId){ const m=S.movs.find(x=>x.id===q.movId);
      if(m&&(m.qids||[]).length<=1){ S.movs=S.movs.filter(x=>x.id!==m.id); toast('Desmarcado · se quitó su gasto de Finanzas'); }
      else if(m){ m.qids=m.qids.filter(x=>x!==id); toast('Desmarcado · el gasto incluye otras compras: ajústalo en Finanzas'); } }
    q.st='pe'; q.movId=null; save(); render(); return; }
  q.st='ok'; if(q.valor==null||q.valor==='') q.valor=qPlan(q); save(); render();
  registerQ([id], true);
}
function registerQ(ids, fromCheck){
  const qs=ids.map(i=>S.qlist.find(x=>x.id===i)).filter(Boolean); if(!qs.length) return;
  const amt=qs.reduce((s,q)=>s+qPaid(q),0); const first=qs[0];
  const isMat=first.list==='mat'; const blks=[...new Set(qs.map(q=>q.blk||''))]; const teams=[...new Set(qs.map(q=>q.team).filter(Boolean))];
  const who = isMat ? 'mateo' : (MERC_COMPRAS.find(c=>c.k===first.part)||MERC_COMPRAS[0]).who;
  const names = qs.length===1 ? first.n+(first.d?' ('+first.d+')':'') : qs.length+' productos: '+qs.map(q=>q.n).join(', ');
  const para = isMat && teams.length ? ' · para '+teams.map(t=>t+' '+LEADERS[t].split(' ')[0]).join(', ') : '';
  const notes = qs.map(q=>q.notas).filter(Boolean).join(' · ');
  openMov('gasto',{from:who,met:'efectivo',part:isMat?'ac_mat':(first.part||'co_merc1'),blk:isMat&&blks.length===1?blks[0]:'',amt,
    desc:'Compra en Quibdó: '+names+para, ref:notes, qids:ids, recibos:qs.flatMap(q=>q.recibos||[]), remind:!!fromCheck});
}

function wordsToDigits(t){
  const toks=t.split(/(\s+)/); let out=[], run=[];
  const flush=()=>{ if(!run.length) return; let res=0,g=0,any=false;
    for(const w of run){ if(w==='y') continue; if(NUMW[w]!=null){g+=NUMW[w];any=true;} else if(w==='mil'){ g=(g||1)*1000; res+=g; g=0; any=true; } else if(/^millon(es)?$/.test(w)){ res=(res+g||1)*1e6; g=0; any=true; } }
    out.push(any?String(res+g):run.join(' ')); run=[]; };
  const words=t.split(/\s+/);
  for(let i=0;i<words.length;i++){ const w=words[i];
    const isN = NUMW[w]!=null || w==='mil' || /^millon(es)?$/.test(w) || (w==='y' && run.length && NUMW[words[i+1]]!=null && !/^(mil|millon)/.test(words[i+1]||''));
    // 'un/una' sola no es número salvo antes de mil/millón
    if(isN && (w==='un'||w==='una') && !/^(mil|millon)/.test(words[i+1]||'')){ flush(); out.push(w); continue; }
    if(isN && w==='mil' && !run.length && /^\d/.test(out[out.length-1]||'')){ out.push(w); continue; }
    if(isN) run.push(w); else { flush(); out.push(w); } }
  flush(); return out.join(' ');
}

function parseAmount(t){
  t=t.replace(/\b(bloque|equipo|b|e|grupo|las|los)\s*\d+\b/g,' ').replace(/\b\d{1,2}:\d{2}\b/g,' ').replace(/\ba las \d+\b/g,' ');
  const re=/\$?\s?(\d+(?:[.,]\d+)*)\s*(millones|millon|palos?|mil|lucas?|k)?\b/g; let m, parts=[];
  while((m=re.exec(t))){ let v=numVal(m[1]); const u=m[2]||''; if(/millon|palo/.test(u)) v*=1e6; else if(/mil|luca|^k$/.test(u)) v*=1e3; parts.push({v,s:m.index,e:m.index+m[0].length,u}); }
  // "1 millón 200 mil" → suma
  const merged=[]; for(const p of parts){ const L=merged[merged.length-1]; if(L && /millon|palo/.test(L.u) && p.v<1e6 && /^\s*(y|con)?\s*$/.test(t.slice(L.e,p.s))){ L.v+=p.v; L.e=p.e; L.u=p.u; } else merged.push(Object.assign({},p)); }
  const vals=merged.map(p=>Math.round(p.v)).filter(v=>v>=100);
  return vals.length?Math.max(...vals):0;
}

function localParse(seg){

    if(/\bme (paso|dio|envio|mando|transfirio|devolvio|entrego|consigno)\b/.test(t)){ m.to='mateo'; m.from=(H.find(h=>h.id!=='mateo')||{}).id||''; }

    m.qids=S.qlist.filter(q=>q.st!=='ok' && nrm(q.n).split(/\s+/).filter(w=>w.length>=4).some(w=>t.includes(w)) && (!team||!q.team||q.team===team)).map(q=>q.id);

  ov.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(5,6,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`<div class="card" style="max-width:420px;width:100%;padding:26px"><div class="eyebrow">${ico('users')}Libertario 2.0 · Misión Chocó</div><h2 class="h1" style="font-size:34px;margin-top:10px">¿Quién eres?</h2><p class="sub" style="margin-top:6px">Lo que registres queda con tu nombre.</p>
   <div class="list" style="margin-top:18px">${USERS.map(u=>`<button type="button" class="li" style="width:100%;text-align:left;cursor:pointer;background:none;border:0;color:inherit${S.user===u.n?';outline:1px solid rgba(9,167,162,.6);border-radius:14px':''}" onclick="setUser('${u.n}')"><div class="ic">${esc(u.n.replace('P. ','').slice(0,2).toUpperCase())}</div><div class="m"><b>${esc(u.f)}</b><small>${esc(u.r)}</small></div>${ico('chev')}</button>`).join('')}</div></div>`; }
function setUser(n){ S.user=n; save(); const ov=document.getElementById('whoOv'); if(ov) ov.remove(); paintUser(); render(); }
/* movimientos ya registrados que vienen con la app (transferencias de New Breath, camisetas) */
(function seedMovs(){ S.seedDone=S.seedDone||{}; let ch=false;
  const rm=new Set(D.SEED_REMOVE||[]); if(S.movs.some(m=>rm.has(m.id))){ S.movs=S.movs.filter(m=>!rm.has(m.id)); ch=true; }
  for(const m of (D.SEED_MOVS||[])){ if(S.seedDone[m.id]) continue; if(!S.movs.some(x=>x.id===m.id)) S.movs.push(Object.assign(JSON.parse(JSON.stringify(m)),{created:Date.now(),seed:1})); S.seedDone[m.id]=1; ch=true; }
  if(ch) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} })();
render(); paintUser(); if(!S.user&&!FINLOCK) askUser();
setInterval(()=>{ if(!$('#sheet').classList.contains('on') && route==='ahora') render(); else { renderNav(); } }, 60000);
</script>
